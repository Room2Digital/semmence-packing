<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Packing — Australia &amp; Thailand</title>
<meta name="theme-color" content="#0d0d0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Packing">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<style>html,body{margin:0;background:#0d0d0d;color:#f5f3ee}</style>
<style>
:root{
  color-scheme:dark;
  --page:#0d0d0d; --surface:#17171a; --surface-2:#1f1f23; --raised:#26262b;
  --ink:#fff; --ink-2:#c7c6cc; --muted:#8b8a93; --grid:#2c2c32; --baseline:#3a3a42;
  --ring:rgba(255,255,255,.09);
  --blue:#4a9eff; --green:#2bb673; --violet:#9b8cf4; --orange:#ff7a45; --pink:#f0608d;
  --good:#2bb673; --warn:#ff7a45;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:clip;-webkit-text-size-adjust:100%}
body{background:var(--page);color:var(--ink);font-family:var(--font);line-height:1.45;
  -webkit-font-smoothing:antialiased;padding-bottom:calc(80px + var(--sab));
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:50;background:rgba(13,13,13,.9);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--grid);padding:calc(12px + var(--sat)) 0 12px}
.hrow{display:flex;align-items:center;gap:15px}
.kicker{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:650}
h1{font-size:21px;font-weight:800;letter-spacing:-.02em;margin-top:3px;line-height:1.15}
h1 .b{color:var(--blue)} h1 .o{color:var(--orange)}
.ring{flex:0 0 auto;position:relative;width:60px;height:60px}
.ring svg{transform:rotate(-90deg)}
.ring .tr{stroke:var(--surface-2)}
.ring .va{stroke:var(--good);stroke-linecap:round;transition:stroke-dasharray .5s cubic-bezier(.4,0,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:800;letter-spacing:-.02em}
.hsub{display:flex;align-items:center;gap:9px;margin-top:9px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.hsub .dot{width:3px;height:3px;border-radius:50%;background:var(--baseline)}
.stale{color:var(--warn)}

/* ---------- nav ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;justify-content:center;
  background:rgba(13,13,13,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--grid);padding-bottom:var(--sab)}
nav button{flex:1;max-width:160px;background:none;border:0;color:var(--muted);font:650 10px var(--font);
  letter-spacing:.03em;padding:10px 2px 11px;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:4px;border-top:2px solid transparent;margin-top:-1px;transition:color .15s}
nav button[aria-current="true"]{color:var(--ink);border-top-color:var(--blue)}
nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
main{padding-top:18px}

/* ---------- structure ---------- */
.sec{margin-bottom:30px}
.sg-head{display:flex;align-items:baseline;gap:10px;margin-bottom:13px}
h2{font-size:17px;font-weight:750;letter-spacing:-.015em}
.n{font-size:12px;color:var(--muted)}
.label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
  font-weight:700;margin:24px 0 10px}
.card{background:var(--surface);border:1px solid var(--ring);border-radius:var(--r);padding:16px 17px}
.note{font-size:13px;color:var(--ink-2);line-height:1.5}
.center{text-align:center;color:var(--muted);padding:46px 20px;font-size:13.5px}

/* ---------- bag cards ---------- */
.baggrid{display:grid;gap:11px}
.bagcard{display:block;width:100%;text-align:left;position:relative;overflow:hidden;
  background:var(--surface);border:1px solid var(--ring);border-radius:var(--r);
  padding:16px 17px 15px;color:inherit;font:inherit;cursor:pointer;
  transition:transform .13s,border-color .15s,background .15s}
.bagcard:active{transform:scale(.988)}
.bagcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--bc)}
.bagcard::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 0% 0%,color-mix(in srgb,var(--bc) 13%,transparent),transparent 62%)}
.bagtop{display:flex;align-items:flex-start;gap:12px;position:relative;z-index:1}
.bagic{flex:0 0 auto;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--bc) 18%,transparent);
  border:1px solid color-mix(in srgb,var(--bc) 32%,transparent);font-size:19px}
.bagname{font-size:15.5px;font-weight:700;letter-spacing:-.015em}
.bagmeta{font-size:12px;color:var(--muted);margin-top:2px}
.bagpill{flex:0 0 auto;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;
  padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--ring)}
.bagpill.done{background:color-mix(in srgb,var(--good) 18%,transparent);color:#6ee7a8;
  border-color:color-mix(in srgb,var(--good) 36%,transparent)}
.fill{height:4px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:13px;position:relative;z-index:1}
.fill i{display:block;height:100%;border-radius:999px;background:var(--bc);transition:width .45s cubic-bezier(.4,0,.2,1)}
.bagnote{font-size:12.5px;color:var(--ink-2);line-height:1.45;margin-top:11px;position:relative;z-index:1}

/* ---------- item rows ---------- */
.catline{display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted);font-weight:700;margin:22px 0 4px}
.catline:first-child{margin-top:4px}
.catline span{flex:1;height:1px;background:var(--grid)}
.row{display:flex;gap:13px;align-items:flex-start;padding:13px 2px;border-bottom:1px solid var(--grid)}
.row:last-child{border-bottom:0}
.tick{flex:0 0 auto;width:24px;height:24px;margin-top:1px;border-radius:7px;
  border:1.5px solid var(--baseline);background:var(--surface-2);cursor:pointer;
  display:grid;place-items:center;transition:.18s}
.tick:active{transform:scale(.9)}
.tick.on{background:var(--good);border-color:var(--good)}
.tick svg{width:13px;height:13px;stroke:#fff;stroke-width:3.2;fill:none;opacity:0;
  stroke-linecap:round;stroke-linejoin:round;transition:opacity .15s}
.tick.on svg{opacity:1}
.rbody{flex:1;min-width:0}
.rname{font-size:14.5px;display:flex;flex-wrap:wrap;gap:7px;align-items:baseline;line-height:1.35}
.row.done .rname{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--baseline)}
.qty{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.rnote{font-size:12.5px;color:var(--ink-2);margin-top:5px;line-height:1.5}
.row.done .rnote{color:var(--muted)}
.rfoot{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;align-items:center}
.pill{font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:999px;
  background:var(--surface-2);color:var(--ink-2);border:1px solid var(--ring);white-space:nowrap}
.pill.crit{background:rgba(240,96,141,.14);color:#ff9bbb;border-color:rgba(240,96,141,.34)}
.pill.store{background:rgba(155,140,244,.14);color:#c0b4ff;border-color:rgba(155,140,244,.32)}
.pill.buy{background:rgba(74,158,255,.14);color:#8cc4ff;border-color:rgba(74,158,255,.32)}
.pill.hand{background:rgba(43,182,115,.14);color:#6ee7a8;border-color:rgba(43,182,115,.32)}
.bagsel{font:inherit;font-size:10.5px;font-weight:600;background:var(--surface-2);color:var(--ink-2);
  border:1px solid var(--ring);border-radius:999px;padding:3px 8px;cursor:pointer}

/* ---------- legs timeline ---------- */
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:7px;top:10px;bottom:10px;width:2px;
  background:linear-gradient(180deg,var(--grid),var(--baseline),var(--grid))}
.legcard{position:relative;background:var(--surface);border:1px solid var(--ring);
  border-radius:14px;padding:14px 15px;margin-bottom:10px;cursor:pointer;transition:border-color .15s}
.legcard:active{transform:scale(.99)}
.legcard::before{content:"";position:absolute;left:-23px;top:19px;width:10px;height:10px;
  border-radius:50%;background:var(--baseline);border:2px solid var(--page)}
.legcard.key{border-color:rgba(255,122,69,.4);background:linear-gradient(160deg,rgba(255,122,69,.07),var(--surface) 60%)}
.legcard.key::before{background:var(--orange);box-shadow:0 0 0 3px rgba(255,122,69,.18)}
.legtop{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.legname{font-size:14.5px;font-weight:700;letter-spacing:-.01em}
.legdate{font-size:11.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.legwhere{font-size:12px;color:var(--blue);margin-top:2px}
.legcard.key .legwhere{color:var(--orange)}
.legnote{font-size:12.5px;color:var(--ink-2);margin-top:9px;line-height:1.5}
.bagchips{display:flex;gap:5px;margin-top:11px;flex-wrap:wrap}
.chip{font-size:9.5px;font-weight:700;letter-spacing:.06em;padding:3px 7px;border-radius:6px;
  background:var(--surface-2);color:var(--baseline);border:1px solid var(--grid)}
.chip.has{background:rgba(74,158,255,.15);color:#8cc4ff;border-color:rgba(74,158,255,.32)}

/* ---------- repack ---------- */
.split{display:grid;gap:12px}
.col{background:var(--surface);border:1px solid var(--ring);border-radius:var(--r);padding:16px 17px}
.col.stay{border-color:rgba(155,140,244,.32);background:linear-gradient(170deg,rgba(155,140,244,.07),var(--surface) 58%)}
.col.come{border-color:rgba(43,182,115,.32);background:linear-gradient(170deg,rgba(43,182,115,.07),var(--surface) 58%)}
.colhead{font-size:14px;font-weight:750;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.colsub{font-size:11.5px;color:var(--muted);margin:4px 0 13px}
.mini{font-size:13px;padding:8px 0;border-bottom:1px solid var(--grid);display:flex;
  justify-content:space-between;gap:10px;align-items:baseline}
.mini:last-child{border-bottom:0}
.mini b{font-weight:500;color:var(--ink)}
.mini span{color:var(--muted);font-size:10.5px;font-weight:700;letter-spacing:.05em;white-space:nowrap}

/* ---------- callouts ---------- */
.alert{border-radius:var(--r);padding:15px 16px;margin-bottom:16px;
  background:rgba(255,122,69,.09);border:1px solid rgba(255,122,69,.32)}
.alert b{color:var(--orange);font-size:14px;letter-spacing:-.01em}
.alert p{font-size:12.5px;color:var(--ink-2);margin-top:6px;line-height:1.55}
.alert.info{background:rgba(74,158,255,.08);border-color:rgba(74,158,255,.28)}
.alert.info b{color:var(--blue)}

/* ---------- day bags ---------- */
.daycard{display:block;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--ring);border-radius:var(--r);padding:16px 17px;color:inherit;font:inherit;
  cursor:pointer;position:relative;overflow:hidden;transition:transform .13s}
.daycard:active{transform:scale(.988)}
.daycard::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 100% 0%,rgba(255,122,69,.12),transparent 60%)}
.dayhead{display:flex;justify-content:space-between;gap:12px;align-items:baseline;position:relative;z-index:1}

/* ---------- misc ---------- */
.search{width:100%;background:var(--surface);border:1px solid var(--ring);border-radius:12px;
  color:var(--ink);font:inherit;font-size:15px;padding:12px 14px;margin-bottom:16px}
.search::placeholder{color:var(--muted)}
.back{background:none;border:0;color:var(--blue);font:inherit;font-size:13.5px;font-weight:600;
  cursor:pointer;padding:6px 0;margin-bottom:10px;display:flex;align-items:center;gap:5px}
.addrow{display:flex;gap:9px;margin-top:13px}
.addrow input{flex:1;background:var(--surface-2);border:1px solid var(--ring);border-radius:10px;
  color:var(--ink);font:inherit;font-size:14px;padding:10px 12px}
.addrow button{background:var(--blue);border:0;color:#fff;font:inherit;font-size:14px;
  font-weight:700;border-radius:10px;padding:10px 17px;cursor:pointer}

@media(min-width:760px){
  .wrap{max-width:900px;padding:0 26px}
  h1{font-size:26px} h2{font-size:19px}
  .ring{width:70px;height:70px} .ring b{font-size:16px}
  nav button{max-width:170px;font-size:11px}
  .baggrid{grid-template-columns:1fr 1fr;gap:12px}
  .split{grid-template-columns:1fr 1fr}
  .tl{padding-left:30px}
}
@media(min-width:1080px){
  .wrap{max-width:1020px}
  .baggrid{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="hrow">
    <div style="flex:1;min-width:0">
      <div class="kicker">19 Nov 2026 – 24 Jan 2027</div>
      <h1><span class="b">Australia</span> &amp; <span class="o">Thailand</span></h1>
    </div>
    <div class="ring">
      <svg viewBox="0 0 44 44" width="100%" height="100%">
        <circle class="tr" cx="22" cy="22" r="19" fill="none" stroke-width="4"/>
        <circle class="va" id="ringv" cx="22" cy="22" r="19" fill="none" stroke-width="4"
                stroke-dasharray="0 120"/>
      </svg>
      <b id="ringp">0%</b>
    </div>
  </div>
  <div class="hsub">
    <span id="plab">—</span>
    <span class="dot"></span>
    <span id="pkg">—</span>
    <span id="pstale"></span>
  </div>
</div></header>

<main class="wrap" id="view"></main>

<nav id="tabs">
  <button data-t="bags"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span>Bags</span></button>
  <button data-t="legs"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 4 3 14 0 18M12 3c-3 4-3 14 0 18"/></svg><span>Legs</span></button>
  <button data-t="repack"><svg viewBox="0 0 24 24"><path d="M4 7h13l-3-3M20 17H7l3 3"/></svg><span>Repack</span></button>
  <button data-t="all"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span>All</span></button>
</nav>

<script>
const DATA=__DATA__;
const SB_URL="https://xsgvdwoekpluynhsdlxm.supabase.co",
      SB_KEY="sb_publishable_5LTV2buBZgF3Fg0UVfOjvw_YiRD3oqc",
      HDRS={apikey:SB_KEY,Authorization:"Bearer "+SB_KEY};
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
             set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

const BAGS=DATA.bags, LEGS=DATA.legs, DAYBAGS=DATA.daybags||[], SHOPPING=DATA.shopping||[];
let ITEMS=DATA.items.slice().concat(store.get("pack:custom",[]));
let STATE=store.get("pack:state",{});
let TAB=store.get("pack:tab","bags"), OPEN=store.get("pack:openbag",null),
    OPENLEG=null, OPENDAY=null, OPENSHOP=null, Q="", STALE=false;

const BAGCOL={L1:"var(--blue)",L2:"var(--green)",CB:"var(--violet)",BP:"var(--orange)",SL:"var(--pink)"};
const BAGICON={L1:"🧳",L2:"👟",CB:"🎒",BP:"🪢",SL:"📱"};
const CATICON={docs:"📄",tech:"🔌",toiletries:"🧴",health:"💊",clothing:"👕",footwear:"👟",
               kit:"🧰",flight:"✈️",added:"✏️"};
const KEYLEGS={jet:1,repack:1,drop:1,ret:1};

const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const bagOf=i=>(STATE[i.id]&&STATE[i.id].bag)||i.bag;
const isPacked=i=>!!(STATE[i.id]&&STATE[i.id].packed);
const grams=i=>i.g||0;
const kg=g=>(g/1000).toFixed(1)+" kg";
const destOf=i=>i.cat==="clothing"?"L1":"L2";

function totals(){const t=ITEMS.length,d=ITEMS.filter(isPacked).length;return{t,d,pc:t?Math.round(d/t*100):0}}
function bagStats(id){const in_=ITEMS.filter(i=>bagOf(i)===id);
  return{n:in_.length,done:in_.filter(isPacked).length,g:in_.reduce((a,i)=>a+grams(i),0)}}

async function pull(){
  try{const r=await fetch(`${SB_URL}/rest/v1/pack_state?select=*`,{headers:HDRS,cache:"no-store"});
    if(!r.ok)throw 0;const rows=await r.json();const s={};
    rows.forEach(x=>s[x.iid]={packed:!!x.packed,bag:x.bag||null});
    STATE=s;store.set("pack:state",s);STALE=false;
  }catch(e){STALE=true}
  render();
}
async function push(iid){
  const s=STATE[iid]||{};
  try{await fetch(`${SB_URL}/rest/v1/pack_state`,{method:"POST",
    headers:Object.assign({},HDRS,{"Content-Type":"application/json",Prefer:"resolution=merge-duplicates,return=minimal"}),
    body:JSON.stringify({iid,packed:!!s.packed,bag:s.bag||null})});STALE=false}
  catch(e){STALE=true}
  paintHead();
}
function toggle(id){const s=STATE[id]||(STATE[id]={});s.packed=!s.packed;
  store.set("pack:state",STATE);push(id);render()}
function move(id,bag){const s=STATE[id]||(STATE[id]={});s.bag=bag;
  store.set("pack:state",STATE);push(id);render()}

function paintHead(){
  const{t,d,pc}=totals(), C=2*Math.PI*19;
  const r=document.getElementById("ringv");
  if(r)r.setAttribute("stroke-dasharray",`${(pc/100*C).toFixed(1)} ${C.toFixed(1)}`);
  document.getElementById("ringp").textContent=pc+"%";
  document.getElementById("plab").textContent=d+" of "+t+" packed";
  document.getElementById("pkg").textContent=kg(ITEMS.reduce((a,i)=>a+grams(i),0))+" all in";
  const st=document.getElementById("pstale");
  st.textContent=STALE?"· offline, saved on this device":"";
  st.className=STALE?"stale":"";
}

const tickHTML=i=>`<button class="tick${isPacked(i)?" on":""}" onclick="toggle('${i.id}')" aria-label="packed">
  <svg viewBox="0 0 24 24"><path d="M4 12.5 9.5 18 20 6.5"/></svg></button>`;
const bagSel=i=>`<select class="bagsel" onchange="move('${i.id}',this.value)" onclick="event.stopPropagation()">`+
  BAGS.map(b=>`<option value="${b.id}"${bagOf(i)===b.id?" selected":""}>${esc(b.id)}</option>`).join("")+`</select>`;

function rowHTML(i){
  const tags=[];
  if(i.crit)tags.push('<span class="pill crit">essential</span>');
  if(i.fate==="store")tags.push('<span class="pill store">parks in Bangkok</span>');
  if(i.fate==="buy")tags.push('<span class="pill buy">buy en route</span>');
  if(i.fate==="handover")tags.push('<span class="pill hand">given away in Phuket</span>');
  return `<div class="row${isPacked(i)?" done":""}">${tickHTML(i)}<div class="rbody">
    <div class="rname">${esc(i.name)}${i.qty>1?` <span class="qty">×${i.qty}</span>`:""}</div>
    ${i.note?`<div class="rnote">${esc(i.note)}</div>`:""}
    <div class="rfoot">${bagSel(i)}${tags.join("")}</div></div></div>`;
}

/* ---------- bags ---------- */
function vBags(){
  if(OPEN)return vBagDetail();
  const cabin=(bagStats("BP").g+bagStats("SL").g)/1000;
  const onward=ITEMS.filter(i=>i.fate!=="store").reduce((a,i)=>a+grams(i),0)/1000;
  return `<div class="sec">
    ${onward>7?`<div class="alert"><b>Cabin bag is over Thai's limit</b>
      <p>Your onward kit is about ${onward.toFixed(1)} kg across the cabin bag, backpack and sling.
      Thai Airways Economy allows <b>one cabin piece at 7 kg</b> on TG206, plus a handbag under 1.5 kg.
      Jetstar is fine — the cabin bag goes in the hold there against your prepaid 40 kg.
      It's the Phuket to Bangkok hop that's exposed. Wear the trainers and the heaviest layers,
      and keep the dense things in the suitcases that get checked.</p></div>`:""}
    <div class="sg-head"><h2>Your five bags</h2><span class="n">tap to open</span></div>
    <div class="baggrid">
    ${BAGS.map(b=>{const s=bagStats(b.id);const pc=s.n?Math.round(s.done/s.n*100):0;
      return `<button class="bagcard" style="--bc:${BAGCOL[b.id]||"var(--blue)"}"
        onclick="OPEN='${b.id}';store.set('pack:openbag','${b.id}');render()">
        <div class="bagtop">
          <span class="bagic">${BAGICON[b.id]||"🧳"}</span>
          <span style="flex:1;min-width:0">
            <span class="bagname" style="display:block">${esc(b.name)}</span>
            <span class="bagmeta">${s.n} items · ${kg(s.g)}</span>
          </span>
          <span class="bagpill${pc===100&&s.n?" done":""}">${s.done}/${s.n}</span>
        </div>
        <div class="fill"><i style="width:${pc}%"></i></div>
        <div class="bagnote">${esc(b.note)}</div></button>`}).join("")}
    </div>

    ${DAYBAGS.length?`<div class="label">Day bags</div>
      ${DAYBAGS.map(d=>`<button class="daycard" onclick="OPENDAY='${d.id}';render()">
        <div class="dayhead"><span>
          <span class="bagname" style="display:block">${esc(d.name)}</span>
          <span class="bagmeta">${esc(d.bag)} · ${d.items.length} things</span></span>
          <span class="bagpill">${esc(d.dates)}</span></div>
        <div class="bagnote">${esc(d.where)}</div></button>`).join("")}`:""}

    ${SHOPPING.length?`<div class="label">Buy on arrival</div>
      ${SHOPPING.map(sh=>`<button class="daycard" onclick="OPENSHOP='${sh.id}';render()">
        <div class="dayhead"><span>
          <span class="bagname" style="display:block">${esc(sh.name)}</span>
          <span class="bagmeta">${esc(sh.where)} · ${sh.items.length} things</span></span>
          <span class="bagpill">${esc(sh.when)}</span></div></button>`).join("")}`:""}

    <div class="label">Missing something?</div>
    <div class="card"><div class="colhead">Add an item</div>
      <div class="colsub">It saves to your list and syncs.</div>
      <div class="addrow"><input id="newitem" placeholder="e.g. snorkel mask"><button onclick="addItem()">Add</button></div></div>
  </div>`;
}

function vBagDetail(){
  const b=BAGS.find(x=>x.id===OPEN)||BAGS[0];
  const in_=ITEMS.filter(i=>bagOf(i)===b.id), s=bagStats(b.id);
  const pc=s.n?Math.round(s.done/s.n*100):0;
  const cats={};in_.forEach(i=>(cats[i.cat]=cats[i.cat]||[]).push(i));
  return `<button class="back" onclick="OPEN=null;store.set('pack:openbag',null);render()">‹ All bags</button>
    <div class="sec">
      <div class="card" style="--bc:${BAGCOL[b.id]};margin-bottom:16px">
        <div class="bagtop"><span class="bagic" style="--bc:${BAGCOL[b.id]}">${BAGICON[b.id]||"🧳"}</span>
          <span style="flex:1"><span class="bagname" style="display:block">${esc(b.name)}</span>
          <span class="bagmeta">${s.done} of ${s.n} packed · ${kg(s.g)}</span></span></div>
        <div class="fill" style="--bc:${BAGCOL[b.id]}"><i style="width:${pc}%"></i></div>
        <div class="bagnote">${esc(b.note)}</div></div>
      ${Object.keys(cats).map(c=>`<div class="catline">${CATICON[c]||"•"} ${esc(c)}<span></span></div>`+
        cats[c].map(rowHTML).join("")).join("")}
      ${in_.length?"":'<div class="center">Nothing assigned to this bag.</div>'}</div>`;
}

function addItem(){const el=document.getElementById("newitem");const v=(el.value||"").trim();if(!v)return;
  const item={id:"custom-"+Date.now(),name:v,cat:"added",bag:OPEN||"CB",qty:1,g:0,fate:"always",note:"",crit:false};
  const c=store.get("pack:custom",[]);c.push(item);store.set("pack:custom",c);ITEMS.push(item);el.value="";render()}

/* ---------- day bag ---------- */
function vDayBag(){
  const d=DAYBAGS.find(x=>x.id===OPENDAY);
  if(!d)return(OPENDAY=null,vBags());
  const tot=d.items.reduce((a,i)=>a+(i.g||0),0);
  return `<button class="back" onclick="OPENDAY=null;render()">‹ Bags</button>
    <div class="sec">
      <div class="sg-head"><h2>${esc(d.name)}</h2><span class="n">${esc(d.dates)}</span></div>
      <div class="card" style="margin-bottom:14px">
        <div class="bagmeta" style="margin:0 0 8px">${esc(d.where)} · ${esc(d.bag)} · ${kg(tot)}</div>
        <div class="note">${esc(d.note)}</div></div>
      ${d.warn?`<div class="alert"><b>The thing to get right</b><p>${esc(d.warn)}</p></div>`:""}
      <div class="label">What goes in</div>
      ${d.items.map((i,n)=>{
        const id="day:"+d.id+":"+n, on=!!(STATE[id]&&STATE[id].packed);
        return `<div class="row${on?" done":""}">
          <button class="tick${on?" on":""}" onclick="toggleDay('${id}')" aria-label="packed">
            <svg viewBox="0 0 24 24"><path d="M4 12.5 9.5 18 20 6.5"/></svg></button>
          <div class="rbody"><div class="rname">${esc(i.name)}
            ${i.crit?'<span class="pill crit">essential</span>':""}</div>
            ${i.note?`<div class="rnote">${esc(i.note)}</div>`:""}</div></div>`;
      }).join("")}
    </div>`;
}
function vShop(){
  const sh=SHOPPING.find(x=>x.id===OPENSHOP);
  if(!sh)return(OPENSHOP=null,vBags());
  return `<button class="back" onclick="OPENSHOP=null;render()">‹ Bags</button>
    <div class="sec">
      <div class="sg-head"><h2>${esc(sh.name)}</h2><span class="n">${esc(sh.when)}</span></div>
      <div class="card" style="margin-bottom:14px">
        <div class="bagmeta" style="margin:0 0 8px">${esc(sh.where)}</div>
        <div class="note">${esc(sh.note)}</div></div>
      <div class="label">Shopping list</div>
      ${sh.items.map((i,n)=>{
        const id="shop:"+sh.id+":"+n, on=!!(STATE[id]&&STATE[id].packed);
        return `<div class="row${on?" done":""}">
          <button class="tick${on?" on":""}" onclick="toggleDay('${id}')" aria-label="bought">
            <svg viewBox="0 0 24 24"><path d="M4 12.5 9.5 18 20 6.5"/></svg></button>
          <div class="rbody"><div class="rname">${esc(i.name)}
            ${i.crit?'<span class="pill crit">don\'t skip</span>':""}</div>
            ${i.note?`<div class="rnote">${esc(i.note)}</div>`:""}</div></div>`;
      }).join("")}
    </div>`;
}
function toggleDay(id){const s=STATE[id]||(STATE[id]={});s.packed=!s.packed;
  store.set("pack:state",STATE);push(id);render()}

/* ---------- legs ---------- */
const BAGFULL={L1:"Into the cases",L2:"Suitcase 2",CB:"Cabin bag",BP:"Backpack",SL:"Sling bag"};
function planList(key,arr,l){
  if(!arr||!arr.length)return"";
  const id=b=>"plan:"+l.id+":"+key+":"+b;
  return `<div class="label">${key==="worn"?"Worn":esc(BAGFULL[key]||key)}</div>
    <div class="card" style="--bc:${BAGCOL[key]||"var(--muted)"}">
    ${arr.map((x,n)=>{const k=id(n),on=!!(STATE[k]&&STATE[k].packed);
      return `<div class="row${on?" done":""}" style="padding:10px 0">
        <button class="tick${on?" on":""}" onclick="toggleDay('${k}')" aria-label="packed">
          <svg viewBox="0 0 24 24"><path d="M4 12.5 9.5 18 20 6.5"/></svg></button>
        <div class="rbody"><div class="rname">${esc(x.n)}
          ${x.add?'<span class="pill buy">I\'d add this</span>':""}</div>
          ${x.note?`<div class="rnote">${esc(x.note)}</div>`:""}</div></div>`}).join("")}
    </div>`;
}
function planHTML(l){
  const p=l.plan,added=["SL","BP","CB"].reduce((a,k)=>a+((p[k]||[]).filter(x=>x.add).length),0);
  return `<div class="label">What goes where</div>
    ${added?`<div class="alert info"><b>${added} things I'd add</b>
      <p>Marked below. The rest is your plan as you gave it.</p></div>`:""}
    ${planList("worn",p.worn,l)}${planList("SL",p.SL,l)}${planList("BP",p.BP,l)}${planList("CB",p.CB,l)}${planList("L1",p.L1,l)}`;
}
function vLegs(){
  if(OPENLEG){
    const l=LEGS.find(x=>x.id===OPENLEG);
    const has=(l.bags||"").split(" ").filter(Boolean);
    const avail=ITEMS.filter(i=>has.includes(bagOf(i))&&!(l.after==="repack"&&i.fate==="store"));
    const crit=avail.filter(i=>i.crit);
    return `<button class="back" onclick="OPENLEG=null;render()">‹ All legs</button>
      <div class="sec"><div class="sg-head"><h2>${esc(l.name)}</h2><span class="n">${esc(l.dates)}</span></div>
      <div class="legwhere" style="margin-bottom:11px">${esc(l.where)}</div>
      <div class="card"><div class="note">${esc(l.note)}</div>
        <div class="bagchips">${BAGS.map(b=>`<span class="chip${has.includes(b.id)?" has":""}">${b.id}</span>`).join("")}</div></div>
      ${l.plan?planHTML(l):`<div class="label">Don't be without</div><div class="card">
        ${crit.map(i=>`<div class="mini"><b>${esc(i.name)}</b><span>${bagOf(i)}</span></div>`).join("")}</div>`}
      </div>`;
  }
  return `<div class="sec"><div class="sg-head"><h2>The trip, leg by leg</h2><span class="n">${LEGS.length} stages</span></div>
    <div class="tl">${LEGS.map(l=>{const has=(l.bags||"").split(" ").filter(Boolean);
      return `<div class="legcard${KEYLEGS[l.id]?" key":""}" onclick="OPENLEG='${l.id}';render()">
        <div class="legtop"><div class="legname">${esc(l.name)}</div><div class="legdate">${esc(l.dates)}</div></div>
        <div class="legwhere">${esc(l.where)}</div>
        <div class="legnote">${esc(l.note)}</div>
        <div class="bagchips">${BAGS.map(b=>`<span class="chip${has.includes(b.id)?" has":""}">${b.id}</span>`).join("")}</div>
      </div>`}).join("")}</div></div>`;
}

/* ---------- repack ---------- */
function vRepack(){
  const stay=ITEMS.filter(i=>i.fate==="store"),
        come=ITEMS.filter(i=>i.fate!=="store"&&i.fate!=="handover"),
        gone=ITEMS.filter(i=>i.fate==="handover");
  const kgStay=stay.reduce((a,i)=>a+grams(i),0), kgCome=come.reduce((a,i)=>a+grams(i),0);
  return `<div class="sec">
    <div class="alert"><b>The repack — Phuket, morning of 10 January</b>
      <p>Do this at the Courtyard with space and time, not at an airport. TG206 leaves at 11:50,
      so start after breakfast. Everything on the right carries on with you for the next 13 days.
      Everything on the left goes into the two cases, gets locked, and is dropped at Smilelugg
      the moment you land at 13:20 — then collected on the 23rd during your 4h45 connection.</p></div>
    <div class="split">
      <div class="col stay"><div class="colhead">📦 Into the cases</div>
        <div class="colsub">${stay.length} items · ${kg(kgStay)} · 13 days in storage</div>
        ${stay.map(i=>`<div class="mini"><b>${esc(i.name)}${i.qty>1?" ×"+i.qty:""}</b><span>→ ${destOf(i)}</span></div>`).join("")}</div>
      <div class="col come"><div class="colhead">🎒 Comes with you</div>
        <div class="colsub">${come.length} items · ${kg(kgCome)} · cabin bag, backpack, sling</div>
        ${come.filter(i=>i.crit).map(i=>`<div class="mini"><b>${esc(i.name)}</b><span>${bagOf(i)}</span></div>`).join("")}
        <div class="colsub" style="margin:11px 0 0">Essentials shown. The rest is on the All tab.</div></div>
    </div>
    ${gone.length?`<div class="alert info"><b>Hand these over first</b><p>${gone.map(i=>esc(i.name.replace(" — for handover",""))).join(" and ")} are given away in Phuket, so they should be out of your bags before you start the repack. Sign out of your Apple ID, erase them and remove them from Find My <b>before you fly</b> — an activation-locked device is useless to whoever gets it.</p></div>`:""}
    <div class="label">Before you leave the hotel</div>
    <div class="card">
      <div class="mini"><b>Refill the 100 ml bottles from the full-size supply</b><span>CB</span></div>
      <div class="mini"><b>Lock both cases</b><span>L1 L2</span></div>
      <div class="mini"><b>Photograph what went in each case</b><span>phone</span></div>
      <div class="mini"><b>Smart shirt, trousers and shoes in the cabin bag</b><span>CB</span></div>
      <div class="mini"><b>Power bank out of the cases — cabin only</b><span>SL</span></div>
    </div></div>`;
}

/* ---------- all ---------- */
function vAll(){
  const q=Q.toLowerCase();
  const list=ITEMS.filter(i=>!q||i.name.toLowerCase().includes(q)||(i.note||"").toLowerCase().includes(q)||i.cat.includes(q));
  const cats={};list.forEach(i=>(cats[i.cat]=cats[i.cat]||[]).push(i));
  return `<input class="search" id="q" placeholder="Search everything…" value="${esc(Q)}"
     oninput="Q=this.value;render();const e=document.getElementById('q');e.focus();e.setSelectionRange(e.value.length,e.value.length)">
    <div class="sec">${Object.keys(cats).length?Object.keys(cats).map(c=>
      `<div class="catline">${CATICON[c]||"•"} ${esc(c)} <span></span></div>`+cats[c].map(rowHTML).join("")).join("")
      :'<div class="center">Nothing matches.</div>'}</div>`;
}

function render(){
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.t===TAB));
  document.getElementById("view").innerHTML =
    OPENSHOP?vShop():
    OPENDAY?vDayBag():
    TAB==="bags"?vBags():TAB==="legs"?vLegs():TAB==="repack"?vRepack():vAll();
  paintHead();
}
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{
  TAB=b.dataset.t;store.set("pack:tab",TAB);OPENLEG=null;OPENDAY=null;OPENSHOP=null;
  if(TAB!=="bags")OPEN=null;window.scrollTo(0,0);render()});
render();pull();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
