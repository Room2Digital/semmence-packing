const destOf=i=>i.cat==="clothing"?"L1":"L2";

function totals(){const t=ITEMS.length,d=ITEMS.filter(isPacked).length;return{t,d,pc:t?Math.round(d/t*100):0}}
function bagStats(id){const in_=ITEMS.filter(i=>bagOf(i)===id);
  return{n:in_.length,done:in_.filter(isPacked).length,g:in_.reduce((a,i)=>a+grams(i),0)}}

async function pull(){
  try{const r=await fetch(`${SB_URL}/rest/v1/pack_state?select=*`,{headers:HDRS,cache:"no-store"});
    if(!r.ok)throw 0;const rows=await r.json();const s={};
    rows.forEach(x=>s[x.iid]={packed:!!x.packed,bag:x.bag||null});
    STATE=s;store.set("pack:state",s);STALE=false;
  }catch(e){STALE=true}
  render();
}
async function push(iid){
  const s=STATE[iid]||{};
  try{await fetch(`${SB_URL}/rest/v1/pack_state`,{method:"POST",
    headers:Object.assign({},HDRS,{"Content-Type":"application/json",Prefer:"resolution=merge-duplicates,return=minimal"}),
    body:JSON.stringify({iid,packed:!!s.packed,bag:s.bag||null})});STALE=false}
  catch(e){STALE=true}
  paintHead();
}
function toggle(id){const s=STATE[id]||(STATE[id]={});s.packed=!s.packed;
  store.set("pack:state",STATE);push(id);render()}
function move(id,bag){const s=STATE[id]||(STATE[id]={});s.bag=bag;
  store.set("pack:state",STATE);push(id);render()}

function paintHead(){
  const{t,d,pc}=totals(), C=2*Math.PI*19;
  const r=document.getElementById("ringv");
  if(r)r.setAttribute("stroke-dasharray",`${(pc/100*C).toFixed(1)} ${C.toFixed(1)}`);
  document.getElementById("ringp").textContent=pc+"%";
  document.getElementById("plab").textContent=d+" of "+t+" packed";
  document.getElementById("pkg").textContent=kg(ITEMS.reduce((a,i)=>a+grams(i),0))+" all in";
  const st=document.getElementById("pstale");
  st.textContent=STALE?"· offline, saved on this device":"";
  st.className=STALE?"stale":"";
}

const tickHTML=i=>`<button class="tick${isPacked(i)?" on":""}" onclick="toggle('${i.id}')" aria-label="packed">
  <svg viewBox="0 0 24 24"><path d="M4 12.5 9.5 18 20 6.5"/></svg></button>`;
const bagSel=i=>`<select class="bagsel" onchange="move('${i.id}',this.value)" onclick="event.stopPropagation()">`+
  BAGS.map(b=>`<option value="${b.id}"${bagOf(i)===b.id?" selected":""}>${esc(b.id)}</option>`).join("")+`</select>`;

function rowHTML(i){
  const tags=[];
  if(i.crit)tags.push('<span class="pill crit">essential</span>');
  if(i.fate==="store")tags.push('<span class="pill store">parks in Bangkok</span>');
  if(i.fate==="buy")tags.push('<span class="pill buy">buy en route</span>');
  if(i.fate==="handover")tags.push('<span class="pill hand">given away in Phuket</span>');
  return `<div class="row${isPacked(i)?" done":""}">${tickHTML(i)}<div class="rbody">
    <div class="rname">${esc(i.name)}${i.qty>1?` <span class="qty">×${i.qty}</span>`:""}</div>
    ${i.note?`<div class="rnote">${esc(i.note)}</div>`:""}
    <div class="rfoot">${bagSel(i)}${tags.join("")}</div></div></div>`;
}

/* ---------- bags ---------- */
function vBags(){
  if(OPEN)return vBagDetail();
  const cabin=(bagStats("BP").g+bagStats("SL").g)/1000;
  const onward=ITEMS.filter(i=>i.fate!=="store").reduce((a,i)=>a+grams(i),0)/1000;
  return `<div class="sec">
    ${onward>7?`<div class="alert"><b>Cabin bag is over Thai's limit</b>
      <p>Your onward kit is about ${onward.toFixed(1)} kg across the cabin bag, backpack and sling.
      Thai Airways Economy allows <b>one cabin piece at 7 kg</b> on TG206, plus a handbag under 1.5 kg.
      Jetstar is fine — the cabin bag goes in the hold there against your prepaid 40 kg.
      It's the Phuket to Bangkok hop that's exposed. Wear the trainers and the heaviest layers,
      and keep the dense things in the suitcases that get checked.</p></div>`:""}
    <div class="sg-head"><h2>Your five bags</h2><span class="n">tap to open</span></div>
    <div class="baggrid">
    ${BAGS.map(b=>{const s=bagStats(b.id);const pc=s.n?Math.round(s.done/s.n*100):0;
      return `<button class="bagcard" style="--bc:${BAGCOL[b.id]||"var(--blue)"}"
        onclick="OPEN='${b.id}';store.set('pack:openbag','${b.id}');render()">
        <div class="bagtop">
          ${b.img?`<span class="bagph"><img src="${esc(b.img)}" alt="" loading="lazy"
            onerror="this.closest('.bagph').classList.add('noimg')"></span>`
           :`<span class="bagic">${BAGICON[b.id]||"🧳"}</span>`}
          <span style="flex:1;min-width:0">
            <span class="bagname" style="display:block">${esc(b.name)}</span>
            <span class="bagmeta">${s.n} items · ${kg(s.g)}</span>
          </span>
          <span class="bagpill${pc===100&&s.n?" done":""}">${s.done}/${s.n}</span>
        </div>
        <div class="fill"><i style="width:${pc}%"></i></div>
        <div class="bagnote">${esc(b.note)}</div></button>`}).join("")}
    </div>

    ${DAYBAGS.length?`<div class="label">Day bags</div>
      ${DAYBAGS.map(d=>`<button class="daycard" onclick="OPENDAY='${d.id}';render()">
        <div class="dayhead"><span>
          <span class="bagname" style="display:block">${esc(d.name)}</span>
          <span class="bagmeta">${esc(d.bag)} · ${d.items.length} things</span></span>
          <span class="bagpill">${esc(d.dates)}</span></div>
        <div class="bagnote">${esc(d.where)}</div></button>`).join("")}`:""}

    ${SHOPPING.length?`<div class="label">Buy on arrival</div>
      ${SHOPPING.map(sh=>`<button class="daycard" onclick="OPENSHOP='${sh.id}';render()">
        <div class="dayhead"><span>
          <span class="bagname" style="display:block">${esc(sh.name)}</span>
          <span class="bagmeta">${esc(sh.where)} · ${sh.items.length} things</span></span>
          <span class="bagpill">${esc(sh.when)}</span></div></button>`).join("")}`:""}

    <div class="label">Missing something?</div>
    <div class="card"><div class="colhead">Add an item</div>
      <div class="colsub">It saves to your list and syncs.</div>
      <div class="addrow"><input id="newitem" placeholder="e.g. snorkel mask"><button onclick="addItem()">Add</button></div></div>
  </div>`;
}

function vBagDetail(){
  const b=BAGS.find(x=>x.id===OPEN)||BAGS[0];
  const in_=ITEMS.filter(i=>bagOf(i)===b.id), s=bagStats(b.id);
  const pc=s.n?Math.round(s.done/s.n*100):0;
  const cats={};in_.forEach(i=>(cats[i.cat]=cats[i.cat]||[]).push(i));
  return `<button class="back" onclick="OPEN=null;store.set('pack:openbag',null);render()">‹ All bags</button>
    <div class="sec">
      <div class="card" style="--bc:${BAGCOL[b.id]};margin-bottom:16px">
        <div class="bagtop"><span class="bagic" style="--bc:${BAGCOL[b.id]}">${BAGICON[b.id]||"🧳"}</span>
          <span style="flex:1"><span class="bagname" style="display:block">${esc(b.name)}</span>
          <span class="bagmeta">${s.done} of ${s.n} packed · ${kg(s.g)}</span></span></div>
        <div class="fill" style="--bc:${BAGCOL[b.id]}"><i style="width:${pc}%"></i></div>
        <div class="bagnote">${esc(b.note)}</div></div>
      ${Object.keys(cats).map(c=>`<div class="catline">${CATICON[c]||"•"} ${esc(c)}<span></span></div>`+
        cats[c].map(rowHTML).join("")).join("")}
      ${in_.length?"":'<div class="center">Nothing assigned to this bag.</div>'}</div>`;
}

function addItem(){const el=document.getElementById("newitem");const v=(el.value||"").trim();if(!v)return;
  const item={id:"custom-"+Date.now(),name:v,cat:"added",bag:OPEN||"CB",qty:1,g:0,fate:"always",note:"",crit:false};
  const c=store.get("pack:custom",[]);c.push(item);store.set("pack:custom",c);ITEMS.push(item);el.value="";render()}

/* ---------- day bag ---------- */
function vDayBag(){
  const d=DAYBAGS.find(x=>x.id===OPENDAY);
  if(!d)return(OPENDAY=null,vBags());
  const tot=d.items.reduce((a,i)=>a+(i.g||0),0);
  return `<button class="back" onclick="OPENDAY=null;render()">‹ Bags</button>
    <div class="sec">
      <div class="sg-head"><h2>${esc(d.name)}</h2><span class="n">${esc(d.dates)}</span></div>
      <div class="card" style="margin-bottom:14px">
        <div class="bagmeta" style="margin:0 0 8px">${esc(d.where)} · ${esc(d.bag)} · ${kg(tot)}</div>
        <div class="note">${esc(d.note)}</div></div>
      ${d.warn?`<div class="alert"><b>The thing to get right</b><p>${esc(d.warn)}</p></div>`:""}
      <div class="label">What goes in</div>
      ${d.items.map((i,n)=>{
        const id="day:"+d.id+":"+n, on=!!(STATE[id]&&STATE[id].packed);
        return `<div class="row${on?" done":""}">
          <button class="tick${on?" on":""}" onclick="toggleDay('${id}')" aria-label="packed">
            <svg viewBox="0 0 24 24"><path d="M4 12.5 9.5 18 20 6.5"/></svg></button>
          <div class="rbody"><div class="rname">${esc(i.name)}
            ${i.crit?'<span class="pill crit">essential</span>':""}</div>
            ${i.note?`<div class="rnote">${esc(i.note)}</div>`:""}</div></div>`;
      }).join("")}
    </div>`;
}
function vShop(){
  const sh=SHOPPING.find(x=>x.id===OPENSHOP);
  if(!sh)return(OPENSHOP=null,vBags());
  return `<button class="back" onclick="OPENSHOP=null;render()">‹ Bags</button>
    <div class="sec">
      <div class="sg-head"><h2>${esc(sh.name)}</h2><span class="n">${esc(sh.when)}</span></div>
      <div class="card" style="margin-bottom:14px">
        <div class="bagmeta" style="margin:0 0 8px">${esc(sh.where)}</div>
        <div class="note">${esc(sh.note)}</div></div>
      <div class="label">Shopping list</div>
      ${sh.items.map((i,n)=>{
        const id="shop:"+sh.id+":"+n, on=!!(STATE[id]&&STATE[id].packed);
        return `<div class="row${on?" done":""}">
          <button class="tick${on?" on":""}" onclick="toggleDay('${id}')" aria-label="bought">
            <svg viewBox="0 0 24 24"><path d="M4 12.5 9.5 18 20 6.5"/></svg></button>
          <div class="rbody"><div class="rname">${esc(i.name)}
            ${i.crit?'<span class="pill crit">don\'t skip</span>':""}</div>
            ${i.note?`<div class="rnote">${esc(i.note)}</div>`:""}</div></div>`;
      }).join("")}
    </div>`;
}
function toggleDay(id){const s=STATE[id]||(STATE[id]={});s.packed=!s.packed;
  store.set("pack:state",STATE);push(id);render()}

/* ---------- legs ---------- */
/* Each leg is a list of bags. A bag has a mode, which is the sash on the tile
   and the only thing that matters at a bag drop: cabin, checked, with, worn, left. */
const MODE={
  cabin:  {label:"Cabin",   cls:"cabin"},
  checked:{label:"Checked", cls:"checked"},
  with:   {label:"With you",cls:"with"},
  worn:   {label:"Worn",    cls:"worn"},
  left:   {label:"Not with you",cls:"left"}
};
const bagMeta=id=>id==="worn"
  ? {id:"worn",name:"Worn",note:"On you, not in a bag.",img:""}
  : (BAGS.find(b=>b.id===id)||{id:id,name:id,note:"",img:""});
const legBagKey=(l,b,n)=>"plan:"+l.id+":"+b.bag+":"+n;
const legBagDone=(l,b)=>b.items.filter((x,n)=>{const k=legBagKey(l,b,n);return STATE[k]&&STATE[k].packed}).length;
function legProgress(l){
  let t=0,d=0;
  (l.bags||[]).forEach(b=>{if(b.mode==="left")return;t+=b.items.length;d+=legBagDone(l,b)});
  (l.do||[]).forEach((x,n)=>{t++;const k="do:"+l.id+":"+n;if(STATE[k]&&STATE[k].packed)d++});
  return {t:t,d:d,pc:t?Math.round(d/t*100):0};
}
function vLegBag(l,b){
  const m=MODE[b.mode]||MODE.with, meta=bagMeta(b.bag), done=legBagDone(l,b);
  return `<button class="back" onclick="OPENBAGLEG=null;render()">‹ ${esc(l.name)}</button>
    <div class="sec">
      <div class="sg-head"><h2>${esc(meta.name)}</h2><span class="n">${esc(l.dates)}</span></div>
      <div class="card" style="--bc:${BAGCOL[b.bag]||"var(--muted)"};margin-bottom:14px">
        <div class="bagtop">
          ${meta.img?`<span class="bagph"><img src="${esc(meta.img)}" alt="" loading="lazy"
            onerror="this.closest('.bagph').classList.add('noimg')"></span>`
           :`<span class="bagic">${BAGICON[b.bag]||"👕"}</span>`}
          <span style="flex:1;min-width:0">
            <span class="sash ${m.cls}">${m.label}</span>
            <span class="bagmeta" style="display:block;margin-top:5px">${done} of ${b.items.length} packed</span>
          </span>
        </div>
        ${b.note?`<div class="bagnote">${esc(b.note)}</div>`:""}
        <div class="fill" style="--bc:${BAGCOL[b.bag]||"var(--muted)"}"><i style="width:${b.items.length?done/b.items.length*100:0}%"></i></div>
      </div>
      <div class="card">
      ${b.items.map((x,n)=>{const k=legBagKey(l,b,n),on=!!(STATE[k]&&STATE[k].packed);
        return `<div class="row${on?" done":""}" style="padding:10px 0">
          <button class="tick${on?" on":""}" onclick="toggleDay('${k}')" aria-label="packed">
            <svg viewBox="0 0 24 24"><path d="M4 12.5 9.5 18 20 6.5"/></svg></button>
          <div class="rbody"><div class="rname">${esc(x.n)}
            ${x.add?'<span class="pill buy">I\'d add this</span>':""}</div>
            ${x.note?`<div class="rnote">${esc(x.note)}</div>`:""}</div></div>`}).join("")}
      </div>
    </div>`;
}
function vLeg(l){
  const pr=legProgress(l);
  const tiles=(l.bags||[]).map((b,i)=>{
    const m=MODE[b.mode]||MODE.with, meta=bagMeta(b.bag), done=legBagDone(l,b), n=b.items.length;
    return `<button class="btile ${m.cls}${b.mode==="left"?" off":""}" style="--bc:${BAGCOL[b.bag]||"var(--muted)"}"
      onclick="OPENBAGLEG=${i};render()">
      <span class="sash ${m.cls}">${m.label}</span>
      <span class="btile-ph">${meta.img?`<img src="${esc(meta.img)}" alt="" loading="lazy"
        onerror="this.closest('.btile-ph').classList.add('noimg')">`:`<i>${BAGICON[b.bag]||"👕"}</i>`}</span>
      <span class="btile-n">${esc(meta.name)}</span>
      <span class="btile-m">${b.mode==="left"?"Left behind":done+" / "+n}</span>
      ${b.mode==="left"?"":`<span class="btile-f"><i style="width:${n?done/n*100:0}%"></i></span>`}
    </button>`}).join("");
  return `<button class="back" onclick="OPENLEG=null;render()">‹ All legs</button>
    <div class="sec">
      <div class="sg-head"><h2>${esc(l.name)}</h2><span class="n">${esc(l.dates)}</span></div>
      <div class="legwhere" style="margin-bottom:4px">${esc(l.where)}</div>
      ${l.via?`<div class="legvia">${esc(l.via)}</div>`:""}
      <div class="card" style="margin:11px 0 14px">
        <div class="note">${esc(l.note)}</div>
        <div class="bagtop" style="margin-top:13px">
          <span style="flex:1"><span class="bagname" style="display:block">${pr.d} of ${pr.t} done</span>
          <span class="bagmeta">Tick as you pack</span></span>
          <span class="bagpill${pr.pc===100&&pr.t?" done":""}">${pr.pc}%</span></div>
        <div class="fill" style="--bc:var(--blue)"><i style="width:${pr.pc}%"></i></div>
      </div>
      <div class="label">The bags</div>
      <div class="btiles">${tiles}</div>
      ${(l.do||[]).length?`<div class="label">Before this leg</div><div class="card">
        ${l.do.map((x,n)=>{const k="do:"+l.id+":"+n,on=!!(STATE[k]&&STATE[k].packed);
          return `<div class="row${on?" done":""}" style="padding:10px 0">
            <button class="tick${on?" on":""}" onclick="toggleDay('${k}')" aria-label="done">
              <svg viewBox="0 0 24 24"><path d="M4 12.5 9.5 18 20 6.5"/></svg></button>
            <div class="rbody"><div class="rname">${esc(x.n)}</div>
              ${x.note?`<div class="rnote">${esc(x.note)}</div>`:""}</div></div>`}).join("")}
        </div>`:""}
    </div>`;
}
function vLegs(){
  if(OPENLEG){
    const l=LEGS.find(x=>x.id===OPENLEG);
    if(!l){OPENLEG=null;return vLegs()}
    if(OPENBAGLEG!==null&&l.bags&&l.bags[OPENBAGLEG])return vLegBag(l,l.bags[OPENBAGLEG]);
    return vLeg(l);
  }
  return `<div class="sec"><div class="sg-head"><h2>The journeys</h2><span class="n">${LEGS.length} legs</span></div>
    <div class="tl">${LEGS.map(l=>{const pr=legProgress(l);
      return `<div class="legcard${l.key?" key":""}" onclick="OPENLEG='${l.id}';OPENBAGLEG=null;render()">
        <div class="legtop"><div class="legname">${esc(l.name)}</div><div class="legdate">${esc(l.dates)}</div></div>
        <div class="legwhere">${esc(l.where)}</div>
        ${l.via?`<div class="legvia">${esc(l.via)}</div>`:""}
        <div class="legmodes">${(l.bags||[]).filter(b=>b.mode!=="left").map(b=>{
          const m=MODE[b.mode]||MODE.with;
          return `<span class="chip ${m.cls}">${b.bag==="worn"?"Worn":b.bag}</span>`}).join("")}</div>
        <div class="fill" style="--bc:var(--blue);margin-top:11px"><i style="width:${pr.pc}%"></i></div>
      </div>`}).join("")}</div></div>`;
}

/* ---------- all ---------- */
function vAll(){
  const q=Q.toLowerCase();
  const list=ITEMS.filter(i=>!q||i.name.toLowerCase().includes(q)||(i.note||"").toLowerCase().includes(q)||i.cat.includes(q));
  const cats={};list.forEach(i=>(cats[i.cat]=cats[i.cat]||[]).push(i));
  return `<input class="search" id="q" placeholder="Search everything…" value="${esc(Q)}"
     oninput="Q=this.value;render();const e=document.getElementById('q');e.focus();e.setSelectionRange(e.value.length,e.value.length)">
    <div class="sec">${Object.keys(cats).length?Object.keys(cats).map(c=>
      `<div class="catline">${CATICON[c]||"•"} ${esc(c)} <span></span></div>`+cats[c].map(rowHTML).join("")).join("")
      :'<div class="center">Nothing matches.</div>'}</div>`;
}

function render(){
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.t===TAB));
  document.getElementById("view").innerHTML =
    OPENSHOP?vShop():
    OPENDAY?vDayBag():
    TAB==="bags"?vBags():TAB==="legs"?vLegs():vAll();
  paintHead();
}
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{
  TAB=b.dataset.t;store.set("pack:tab",TAB);OPENLEG=null;OPENBAGLEG=null;OPENDAY=null;OPENSHOP=null;
  if(TAB!=="bags")OPEN=null;window.scrollTo(0,0);render()});
render();pull();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
