<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Packing — Australia &amp; Thailand</title>
<meta name="theme-color" content="#0d0d0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Packing">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<style>html,body{margin:0;background:#0d0d0d;color:#f5f3ee}</style>
<style>
:root{
  color-scheme:dark;
  --page:#0d0d0d; --surface:#17171a; --surface-2:#1f1f23; --raised:#26262b;
  --ink:#fff; --ink-2:#c7c6cc; --muted:#8b8a93; --grid:#2c2c32; --baseline:#3a3a42;
  --ring:rgba(255,255,255,.09);
  --blue:#4a9eff; --green:#2bb673; --violet:#9b8cf4; --orange:#ff7a45; --pink:#f0608d;
  --good:#2bb673; --warn:#ff7a45;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:clip;-webkit-text-size-adjust:100%}
body{background:var(--page);color:var(--ink);font-family:var(--font);line-height:1.45;
  -webkit-font-smoothing:antialiased;padding-bottom:calc(80px + var(--sab));
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:50;background:rgba(13,13,13,.9);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--grid);padding:calc(12px + var(--sat)) 0 12px}
.hrow{display:flex;align-items:center;gap:15px}
.kicker{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:650}
h1{font-size:21px;font-weight:800;letter-spacing:-.02em;margin-top:3px;line-height:1.15}
h1 .b{color:var(--blue)} h1 .o{color:var(--orange)}
.ring{flex:0 0 auto;position:relative;width:60px;height:60px}
.ring svg{transform:rotate(-90deg)}
.ring .tr{stroke:var(--surface-2)}
.ring .va{stroke:var(--good);stroke-linecap:round;transition:stroke-dasharray .5s cubic-bezier(.4,0,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:800;letter-spacing:-.02em}
.hsub{display:flex;align-items:center;gap:9px;margin-top:9px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.hsub .dot{width:3px;height:3px;border-radius:50%;background:var(--baseline)}
.stale{color:var(--warn)}

/* ---------- nav ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;justify-content:center;
  background:rgba(13,13,13,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--grid);padding-bottom:var(--sab)}
nav button{flex:1;max-width:160px;background:none;border:0;color:var(--muted);font:650 10px var(--font);
  letter-spacing:.03em;padding:10px 2px 11px;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:4px;border-top:2px solid transparent;margin-top:-1px;transition:color .15s}
nav button[aria-current="true"]{color:var(--ink);border-top-color:var(--blue)}
nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
main{padding-top:18px}

/* ---------- structure ---------- */
.sec{margin-bottom:30px}
.sg-head{display:flex;align-items:baseline;gap:10px;margin-bottom:13px}
h2{font-size:17px;font-weight:750;letter-spacing:-.015em}
.n{font-size:12px;color:var(--muted)}
.label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
  font-weight:700;margin:24px 0 10px}
.card{background:var(--surface);border:1px solid var(--ring);border-radius:var(--r);padding:16px 17px}
.note{font-size:13px;color:var(--ink-2);line-height:1.5}
.center{text-align:center;color:var(--muted);padding:46px 20px;font-size:13.5px}

/* ---------- bag cards ---------- */
.baggrid{display:grid;gap:11px}
.bagcard{display:block;width:100%;text-align:left;position:relative;overflow:hidden;
  background:var(--surface);border:1px solid var(--ring);border-radius:var(--r);
  padding:16px 17px 15px;color:inherit;font:inherit;cursor:pointer;
  transition:transform .13s,border-color .15s,background .15s}
.bagcard:active{transform:scale(.988)}
.bagcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--bc)}
.bagcard::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 0% 0%,color-mix(in srgb,var(--bc) 13%,transparent),transparent 62%)}
.bagtop{display:flex;align-items:flex-start;gap:12px;position:relative;z-index:1}
.bagic{flex:0 0 auto;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--bc) 18%,transparent);
  border:1px solid color-mix(in srgb,var(--bc) 32%,transparent);font-size:19px}
.bagname{font-size:15.5px;font-weight:700;letter-spacing:-.015em}
.bagmeta{font-size:12px;color:var(--muted);margin-top:2px}
.bagpill{flex:0 0 auto;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;
  padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--ring)}
.bagpill.done{background:color-mix(in srgb,var(--good) 18%,transparent);color:#6ee7a8;
  border-color:color-mix(in srgb,var(--good) 36%,transparent)}
.fill{height:4px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:13px;position:relative;z-index:1}
.fill i{display:block;height:100%;border-radius:999px;background:var(--bc);transition:width .45s cubic-bezier(.4,0,.2,1)}
.bagnote{font-size:12.5px;color:var(--ink-2);line-height:1.45;margin-top:11px;position:relative;z-index:1}

/* ---------- item rows ---------- */
.catline{display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted);font-weight:700;margin:22px 0 4px}
.catline:first-child{margin-top:4px}
.catline span{flex:1;height:1px;background:var(--grid)}
.row{display:flex;gap:13px;align-items:flex-start;padding:13px 2px;border-bottom:1px solid var(--grid)}
.row:last-child{border-bottom:0}
.tick{flex:0 0 auto;width:24px;height:24px;margin-top:1px;border-radius:7px;
  border:1.5px solid var(--baseline);background:var(--surface-2);cursor:pointer;
  display:grid;place-items:center;transition:.18s}
.tick:active{transform:scale(.9)}
.tick.on{background:var(--good);border-color:var(--good)}
.tick svg{width:13px;height:13px;stroke:#fff;stroke-width:3.2;fill:none;opacity:0;
  stroke-linecap:round;stroke-linejoin:round;transition:opacity .15s}
.tick.on svg{opacity:1}
.rbody{flex:1;min-width:0}
.rname{font-size:14.5px;display:flex;flex-wrap:wrap;gap:7px;align-items:baseline;line-height:1.35}
.row.done .rname{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--baseline)}
.qty{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.rnote{font-size:12.5px;color:var(--ink-2);margin-top:5px;line-height:1.5}
.row.done .rnote{color:var(--muted)}
.rfoot{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;align-items:center}
.pill{font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:999px;
  background:var(--surface-2);color:var(--ink-2);border:1px solid var(--ring);white-space:nowrap}
.pill.crit{background:rgba(240,96,141,.14);color:#ff9bbb;border-color:rgba(240,96,141,.34)}
.pill.store{background:rgba(155,140,244,.14);color:#c0b4ff;border-color:rgba(155,140,244,.32)}
.pill.buy{background:rgba(74,158,255,.14);color:#8cc4ff;border-color:rgba(74,158,255,.32)}
.pill.hand{background:rgba(43,182,115,.14);color:#6ee7a8;border-color:rgba(43,182,115,.32)}
.bagsel{font:inherit;font-size:10.5px;font-weight:600;background:var(--surface-2);color:var(--ink-2);
  border:1px solid var(--ring);border-radius:999px;padding:3px 8px;cursor:pointer}

/* ---------- legs timeline ---------- */
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:7px;top:10px;bottom:10px;width:2px;
  background:linear-gradient(180deg,var(--grid),var(--baseline),var(--grid))}
.legcard{position:relative;background:var(--surface);border:1px solid var(--ring);
  border-radius:14px;padding:14px 15px;margin-bottom:10px;cursor:pointer;transition:border-color .15s}
.legcard:active{transform:scale(.99)}
.legcard::before{content:"";position:absolute;left:-23px;top:19px;width:10px;height:10px;
  border-radius:50%;background:var(--baseline);border:2px solid var(--page)}
.legcard.key{border-color:rgba(255,122,69,.4);background:linear-gradient(160deg,rgba(255,122,69,.07),var(--surface) 60%)}
.legcard.key::before{background:var(--orange);box-shadow:0 0 0 3px rgba(255,122,69,.18)}
.legtop{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.legname{font-size:14.5px;font-weight:700;letter-spacing:-.01em}
.legdate{font-size:11.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.legwhere{font-size:12px;color:var(--blue);margin-top:2px}
.legcard.key .legwhere{color:var(--orange)}
.legnote{font-size:12.5px;color:var(--ink-2);margin-top:9px;line-height:1.5}
.bagchips{display:flex;gap:5px;margin-top:11px;flex-wrap:wrap}
.chip{font-size:9.5px;font-weight:700;letter-spacing:.06em;padding:3px 7px;border-radius:6px;
  background:var(--surface-2);color:var(--baseline);border:1px solid var(--grid)}
.chip.has{background:rgba(74,158,255,.15);color:#8cc4ff;border-color:rgba(74,158,255,.32)}

/* ---------- repack ---------- */
.split{display:grid;gap:12px}
.col{background:var(--surface);border:1px solid var(--ring);border-radius:var(--r);padding:16px 17px}
.col.stay{border-color:rgba(155,140,244,.32);background:linear-gradient(170deg,rgba(155,140,244,.07),var(--surface) 58%)}
.col.come{border-color:rgba(43,182,115,.32);background:linear-gradient(170deg,rgba(43,182,115,.07),var(--surface) 58%)}
.colhead{font-size:14px;font-weight:750;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.colsub{font-size:11.5px;color:var(--muted);margin:4px 0 13px}
.mini{font-size:13px;padding:8px 0;border-bottom:1px solid var(--grid);display:flex;
  justify-content:space-between;gap:10px;align-items:baseline}
.mini:last-child{border-bottom:0}
.mini b{font-weight:500;color:var(--ink)}
.mini span{color:var(--muted);font-size:10.5px;font-weight:700;letter-spacing:.05em;white-space:nowrap}

/* ---------- callouts ---------- */
.alert{border-radius:var(--r);padding:15px 16px;margin-bottom:16px;
  background:rgba(255,122,69,.09);border:1px solid rgba(255,122,69,.32)}
.alert b{color:var(--orange);font-size:14px;letter-spacing:-.01em}
.alert p{font-size:12.5px;color:var(--ink-2);margin-top:6px;line-height:1.55}
.alert.info{background:rgba(74,158,255,.08);border-color:rgba(74,158,255,.28)}
.alert.info b{color:var(--blue)}

/* ---------- day bags ---------- */
.daycard{display:block;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--ring);border-radius:var(--r);padding:16px 17px;color:inherit;font:inherit;
  cursor:pointer;position:relative;overflow:hidden;transition:transform .13s}
.daycard:active{transform:scale(.988)}
.daycard::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 100% 0%,rgba(255,122,69,.12),transparent 60%)}
.dayhead{display:flex;justify-content:space-between;gap:12px;align-items:baseline;position:relative;z-index:1}

/* ---------- misc ---------- */
.search{width:100%;background:var(--surface);border:1px solid var(--ring);border-radius:12px;
  color:var(--ink);font:inherit;font-size:15px;padding:12px 14px;margin-bottom:16px}
.search::placeholder{color:var(--muted)}
.back{background:none;border:0;color:var(--blue);font:inherit;font-size:13.5px;font-weight:600;
  cursor:pointer;padding:6px 0;margin-bottom:10px;display:flex;align-items:center;gap:5px}
.addrow{display:flex;gap:9px;margin-top:13px}
.addrow input{flex:1;background:var(--surface-2);border:1px solid var(--ring);border-radius:10px;
  color:var(--ink);font:inherit;font-size:14px;padding:10px 12px}
.addrow button{background:var(--blue);border:0;color:#fff;font:inherit;font-size:14px;
  font-weight:700;border-radius:10px;padding:10px 17px;cursor:pointer}

@media(min-width:760px){
  .wrap{max-width:900px;padding:0 26px}
  h1{font-size:26px} h2{font-size:19px}
  .ring{width:70px;height:70px} .ring b{font-size:16px}
  nav button{max-width:170px;font-size:11px}
  .baggrid{grid-template-columns:1fr 1fr;gap:12px}
  .split{grid-template-columns:1fr 1fr}
  .tl{padding-left:30px}
}
@media(min-width:1080px){
  .wrap{max-width:1020px}
  .baggrid{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="hrow">
    <div style="flex:1;min-width:0">
      <div class="kicker">19 Nov 2026 – 24 Jan 2027</div>
      <h1><span class="b">Australia</span> &amp; <span class="o">Thailand</span></h1>
    </div>
    <div class="ring">
      <svg viewBox="0 0 44 44" width="100%" height="100%">
        <circle class="tr" cx="22" cy="22" r="19" fill="none" stroke-width="4"/>
        <circle class="va" id="ringv" cx="22" cy="22" r="19" fill="none" stroke-width="4"
                stroke-dasharray="0 120"/>
      </svg>
      <b id="ringp">0%</b>
    </div>
  </div>
  <div class="hsub">
    <span id="plab">—</span>
    <span class="dot"></span>
    <span id="pkg">—</span>
    <span id="pstale"></span>
  </div>
</div></header>

<main class="wrap" id="view"></main>

<nav id="tabs">
  <button data-t="bags"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span>Bags</span></button>
  <button data-t="legs"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 4 3 14 0 18M12 3c-3 4-3 14 0 18"/></svg><span>Legs</span></button>
  <button data-t="repack"><svg viewBox="0 0 24 24"><path d="M4 7h13l-3-3M20 17H7l3 3"/></svg><span>Repack</span></button>
  <button data-t="all"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span>All</span></button>
</nav>

<script>
const DATA={"items":[{"id":"passport","name":"Passport — trackable holder","cat":"docs","bag":"SL","qty":1,"g":60,"fate":"always","note":"Six months' validity beyond 24 Jan 2027. The holder is tracked, so it shows in Find My.","crit":true},{"id":"tdac","name":"Thailand Digital Arrival Card","cat":"docs","bag":"SL","qty":1,"g":0,"fate":"always","note":"Mandatory for every foreign national. Complete it online 4–6 Jan, within 3 days of landing in Phuket on the 7th. Needs flight number, the Courtyard's address and a contact mobile. Save the QR offline.","crit":true},{"id":"eta-aus","name":"Australian ETA","cat":"docs","bag":"SL","qty":1,"g":0,"fate":"always","note":"Approved before you fly — the airline checks it at Gatwick.","crit":true},{"id":"licence","name":"Driving licence — the physical card","cat":"docs","bag":"SL","qty":1,"g":10,"fate":"store","note":"Avis from 29 Dec. No International Driving Permit needed, a UK licence is already in English — but hire firms will not accept a photo or a photocopy. Into the stored case at the Phuket repack; you don't drive again.","crit":true},{"id":"insurance","name":"Travel insurance — policy and 24hr number","cat":"docs","bag":"SL","qty":1,"g":10,"fate":"always","note":"Check the single-article limit before you fly. You are carrying roughly four thousand pounds of Apple hardware and most policies cap any one item at £300–500.","crit":true},{"id":"cards","name":"Bank cards — two providers","cat":"docs","bag":"SL","qty":2,"g":20,"fate":"always","note":"Tracker card in the wallet. Split across two bags so one loss isn't total.","crit":true},{"id":"cash-gbp","name":"Cash — GBP float","cat":"docs","bag":"SL","qty":1,"g":20,"fate":"always","note":"Gatwick, and the taxi home on the 24th.","crit":false},{"id":"cash-aud","name":"Cash — AUD","cat":"docs","bag":"SL","qty":1,"g":20,"fate":"buy","note":"Withdraw on arrival. Perth is near-cashless but markets aren't.","crit":false},{"id":"cash-thb","name":"Cash — 50,000 THB","cat":"docs","bag":"SL","qty":1,"g":120,"fate":"always","note":"About GBP 1,150. Well under Thailand's declaration threshold, which is USD 20,000 equivalent, so nothing to declare. Split it: some in the sling, some in a case, some in the hotel safe — do not carry the lot in one place for 67 days. It funds the ferries, longtails, Khao Sok and the 500 Rai extras, which is where cards stop working.","crit":true},{"id":"flights-off","name":"All 8 flight confirmations — offline","cat":"docs","bag":"SL","qty":1,"g":0,"fate":"always","note":"Saved offline. Phuket and Khao Sok have patchy signal.","crit":true},{"id":"hotels-off","name":"Accommodation confirmations — offline","cat":"docs","bag":"SL","qty":1,"g":0,"fate":"always","note":"Theatre Residence and the 500 Rai transfer details especially.","crit":false},{"id":"bag-conf","name":"Baggage receipts — JQ71 and TG206","cat":"docs","bag":"SL","qty":1,"g":0,"fate":"always","note":"JQ71: 40 kg prepaid, GBP 72.27, ref DMF5N5. TG206: 2 × 23 kg, second bag GBP 15.05, PNR FV844G. Have both at the bag drops.","crit":true},{"id":"storage-receipt","name":"Smilelugg receipt — 14XIWBX4","cat":"docs","bag":"SL","qty":1,"g":5,"fate":"always","note":"Paid, GBP 90.26, two cases, 10–23 Jan. B Floor at Suvarnabhumi, the Airport Rail Link level. Without it you are not getting the cases back.","crit":true},{"id":"taxi-conf","name":"Bangkok taxi — booking 911245279","cat":"docs","bag":"SL","qty":1,"g":0,"fate":"always","note":"Driver contacts you on WhatsApp at +44 7951 592634. Check WhatsApp works on landing.","crit":true},{"id":"phone","name":"Phone","cat":"tech","bag":"SL","qty":1,"g":220,"fate":"always","note":"","crit":true},{"id":"watch","name":"Apple Watch","cat":"tech","bag":"SL","qty":1,"g":50,"fate":"always","note":"","crit":false},{"id":"airpods","name":"AirPods Pro","cat":"tech","bag":"SL","qty":1,"g":60,"fate":"always","note":"Your everyday set once the over-ears are parked.","crit":false},{"id":"sony","name":"Sony over-ear headphones","cat":"tech","bag":"SL","qty":1,"g":250,"fate":"store","note":"Earn their place over the 26 hours out. Into the stored case at the Phuket repack, collected on the 23rd for the flight home.","crit":false},{"id":"ipad-air","name":"iPad Air","cat":"tech","bag":"CB","qty":1,"g":460,"fate":"always","note":"Reading and films. Comes everywhere.","crit":false},{"id":"mba","name":"MacBook Air","cat":"tech","bag":"CB","qty":1,"g":1240,"fate":"store","note":"You work from Perth and stop in Thailand. Into the stored case at the Phuket repack — it does not need to see Samui or the lake.","crit":true},{"id":"dongle","name":"USB-C dongle","cat":"tech","bag":"CB","qty":1,"g":40,"fate":"store","note":"Stores with the Air.","crit":false},{"id":"mouse","name":"Mouse","cat":"tech","bag":"CB","qty":1,"g":80,"fate":"store","note":"Seven weeks of work earns it. Stores with the Air.","crit":false},{"id":"hdmi","name":"HDMI cable","cat":"tech","bag":"CB","qty":1,"g":90,"fate":"store","note":"General purpose — hotel TVs, the MacBook. Stores at Phuket.","crit":false},{"id":"hdmi-switch","name":"Nintendo Switch HDMI cable","cat":"tech","bag":"CB","qty":1,"g":80,"fate":"always","note":"Stays with the Switch. Theatre Residence, Hansar and Krabi La Playa all have TVs.","crit":false},{"id":"ps5-pad","name":"PS5 controller","cat":"tech","bag":"CB","qty":1,"g":280,"fate":"always","note":"For Remote Play. Qatar's Starlink should genuinely carry it — the bandwidth is there and satellite latency is usually workable. Worth testing on the Gatwick to Doha leg before you count on it for the 14 hours to Perth. Pairs natively with the iPad Air as the fallback.","crit":false},{"id":"switch","name":"Nintendo Switch","cat":"tech","bag":"CB","qty":1,"g":400,"fate":"always","note":"Long transits and the Khao Sok evenings.","crit":false},{"id":"charger-mac","name":"MacBook charger — high wattage","cat":"tech","bag":"CB","qty":1,"g":300,"fate":"store","note":"Check the wattage covers the Air. The fold-up 3-in-1 will not charge a laptop.","crit":true},{"id":"plug-uk","name":"Mains plug — UK","cat":"tech","bag":"CB","qty":1,"g":90,"fate":"always","note":"","crit":false},{"id":"adapter-universal","name":"Travel adapter with USB-C","cat":"tech","bag":"CB","qty":1,"g":180,"fate":"always","note":"UK Type G, Australia Type I, Thailand A/C. Check it is rated for the laptop charger, not just phones.","crit":true},{"id":"charger-3in1","name":"Fold-up 3-in-1 charger","cat":"tech","bag":"SL","qty":1,"g":180,"fate":"always","note":"Watch, phone and AirPods from one plug. The best single item in the sling.","crit":false},{"id":"cable-ext","name":"Extendable USB-C cable","cat":"tech","bag":"SL","qty":1,"g":70,"fate":"always","note":"","crit":false},{"id":"cable-shaver","name":"Shaver cable","cat":"tech","bag":"CB","qty":1,"g":40,"fate":"always","note":"Not USB-C at both ends, so nothing else in the bag will charge it. The one cable with no substitute — pack it with the shaver, not loose.","crit":true},{"id":"brick-sm","name":"Power bank — small","cat":"tech","bag":"SL","qty":1,"g":200,"fate":"always","note":"The only one you are taking — the large one is out. Cabin baggage only, never checked.","crit":true},{"id":"esim","name":"Global SIM — 2 months","cat":"tech","bag":"SL","qty":1,"g":0,"fate":"always","note":"Already organised. Covers both countries for the whole trip, so no Australian or Thai eSIM needed on arrival.","crit":false},{"id":"airtags","name":"AirTags","cat":"tech","bag":"CB","qty":5,"g":55,"fate":"always","note":"On the tech bag, sling, backpack and both cases. Get the fifth so suitcase 2 is covered — it sits in third-party storage for 13 days.","crit":true},{"id":"mouthtape","name":"Mouth tape","cat":"flight","bag":"SL","qty":1,"g":20,"fate":"always","note":"","crit":false},{"id":"eyemask","name":"Eye mask","cat":"flight","bag":"SL","qty":1,"g":30,"fate":"always","note":"QR835 is an overnight and QR107 lands at 06:35.","crit":false},{"id":"earplugs","name":"Earplugs","cat":"flight","bag":"SL","qty":1,"g":10,"fate":"always","note":"","crit":false},{"id":"snacks","name":"Snacks for travel days","cat":"flight","bag":"SL","qty":1,"g":150,"fate":"always","note":"","crit":false},{"id":"washbag-lg","name":"Fold-out washbag — large","cat":"toiletries","bag":"L2","qty":1,"g":260,"fate":"store","note":"Lives in the suitcase. Into storage at the Phuket repack.","crit":false},{"id":"washbag-mini","name":"Mini washbags","cat":"toiletries","bag":"CB","qty":2,"g":80,"fate":"always","note":"The hand-luggage pair. These are what you actually use on travel days and at the lake.","crit":true},{"id":"liquids-bag","name":"Clear 1L liquids bag","cat":"toiletries","bag":"SL","qty":1,"g":20,"fate":"always","note":"Re-cleared at Perth, Phuket, Bangkok and Krabi. Keep it reachable.","crit":true},{"id":"decant","name":"Decant bottles, 100 ml","cat":"toiletries","bag":"CB","qty":5,"g":150,"fate":"always","note":"Fill these at the Phuket repack. For the lake you really only need suncream and the basics — Hansar, Krabi La Playa and Theatre Residence all provide the rest.","crit":true},{"id":"suncream","name":"Suncream — full size","cat":"toiletries","bag":"L2","qty":1,"g":200,"fate":"always","note":"Australian suncream is the best there is and cheap. Decant 100 ml for the onward leg.","crit":true},{"id":"suncream-tr","name":"Travel suncream","cat":"toiletries","bag":"SL","qty":1,"g":80,"fate":"always","note":"For the plane and the first day before you buy properly.","crit":false},{"id":"facewash","name":"Travel facewash","cat":"toiletries","bag":"CB","qty":1,"g":90,"fate":"always","note":"","crit":false},{"id":"moisturiser","name":"Moisturiser","cat":"toiletries","bag":"CB","qty":1,"g":100,"fate":"always","note":"","crit":false},{"id":"eyecream","name":"Eye cream","cat":"toiletries","bag":"CB","qty":1,"g":40,"fate":"always","note":"","crit":false},{"id":"sanitiser","name":"Hand sanitiser","cat":"toiletries","bag":"SL","qty":1,"g":60,"fate":"always","note":"","crit":false},{"id":"mozzie","name":"Mosquito spray","cat":"toiletries","bag":"CB","qty":1,"g":120,"fate":"always","note":"Khao Sok is jungle on water and the lake is worst at dusk. Top up with stronger DEET in Thailand if yours is mild.","crit":true},{"id":"shaver","name":"Electric shaver","cat":"toiletries","bag":"CB","qty":1,"g":220,"fate":"always","note":"Check how it charges — if it's a proprietary barrel plug rather than USB-C, that charger has to come too and it's easy to leave behind.","crit":true},{"id":"shave-foam","name":"Mini shaving foam","cat":"toiletries","bag":"CB","qty":1,"g":100,"fate":"always","note":"Under 100 ml so it clears cabin security.","crit":false},{"id":"etoothbrush","name":"Electric toothbrush","cat":"toiletries","bag":"CB","qty":1,"g":180,"fate":"always","note":"Toothpaste bought on arrival; Qatar give you a travel one for the flight. Check the charger — most are an inductive base with a fixed plug, which needs the travel adapter.","crit":true},{"id":"deodorant","name":"Deodorant","cat":"toiletries","bag":"CB","qty":1,"g":100,"fate":"always","note":"Not on your list either. Solid or stick travels better than aerosol and does not count as a liquid.","crit":true},{"id":"lipbalm","name":"Lip balm with SPF","cat":"toiletries","bag":"SL","qty":1,"g":15,"fate":"always","note":"Six hours cycling at Rottnest, a lot of beach, and three long-haul sectors of dry cabin air.","crit":false},{"id":"nail","name":"Nail clippers","cat":"toiletries","bag":"CB","qty":1,"g":40,"fate":"always","note":"Fine in checked. Cabin rules on clippers vary by airport.","crit":false},{"id":"medkit","name":"Small medical pouch","cat":"health","bag":"CB","qty":1,"g":60,"fate":"always","note":"","crit":false},{"id":"imodium","name":"Imodium","cat":"health","bag":"CB","qty":1,"g":20,"fate":"always","note":"The 06:00 ferry on the 17th, then 2h15 by road to the lake. You cannot buy this at 5am on a pier.","crit":true},{"id":"motion","name":"Motion sickness tablets","cat":"health","bag":"CB","qty":1,"g":20,"fate":"always","note":"Samui to Donsak is 1h30 of open water. Take one before boarding, not when you feel it.","crit":true},{"id":"paracetamol","name":"Paracetamol","cat":"health","bag":"CB","qty":1,"g":40,"fate":"always","note":"","crit":false},{"id":"ibuprofen","name":"Ibuprofen","cat":"health","bag":"CB","qty":1,"g":40,"fate":"always","note":"","crit":false},{"id":"antihistamine","name":"Antihistamine","cat":"health","bag":"CB","qty":1,"g":20,"fate":"always","note":"Bites, heat rash, unfamiliar food.","crit":false},{"id":"antiseptic","name":"Antiseptic cream","cat":"health","bag":"CB","qty":1,"g":40,"fate":"always","note":"Coral and scooter scrapes infect fast in the tropics.","crit":true},{"id":"plasters","name":"Plasters + blister plasters","cat":"health","bag":"CB","qty":1,"g":50,"fate":"always","note":"Blister plasters specifically — new sandals and a lot of walking.","crit":true},{"id":"rehydration","name":"Rehydration sachets","cat":"health","bag":"CB","qty":6,"g":60,"fate":"always","note":"Heat, beer and stomach trouble. Tiny and cheap.","crit":false},{"id":"athletes","name":"Athlete's foot cream","cat":"health","bag":"CB","qty":1,"g":50,"fate":"always","note":"Humidity, flip-flops, wet bathrooms.","crit":false},{"id":"prescriptions","name":"Prescription medication","cat":"health","bag":"SL","qty":1,"g":100,"fate":"always","note":"Enough for 67 days plus buffer, in original packaging, in hand luggage.","crit":true},{"id":"mbp","name":"MacBook Pro — for handover","cat":"tech","bag":"CB","qty":1,"g":1600,"fate":"handover","note":"Given away in Phuket, 7–10 Jan. Sign out of your Apple ID and erase it BEFORE you fly — doing that over hotel wifi with a deadline is miserable. Remove it from Find My or it stays activation-locked and useless to them.","crit":true},{"id":"ipad-mini","name":"iPad mini — for handover","cat":"tech","bag":"CB","qty":1,"g":300,"fate":"handover","note":"Same: signed out, erased and removed from Find My before you fly.","crit":true},{"id":"larq","name":"Larq bottle, 1L","cat":"kit","bag":"BP","qty":1,"g":500,"fate":"always","note":"Self-cleaning, so it earns itself in Thailand. Empty through security, fill after.","crit":true},{"id":"towel-lg","name":"Microfibre towel — large","cat":"kit","bag":"L1","qty":1,"g":300,"fate":"store","note":"Beach days in Perth. Stores at Phuket.","crit":false},{"id":"towel-sm","name":"Microfibre towel — mini","cat":"kit","bag":"CB","qty":1,"g":120,"fate":"always","note":"The one that matters onward — ferries, the lake, Krabi longtails.","crit":true},{"id":"drybag","name":"Dry bag, small — TO BUY","cat":"kit","bag":"BP","qty":1,"g":120,"fate":"buy","note":"Not owned yet. Khao Sok arrives by boat, the ferry deck is wet and Krabi longtails soak everything. Phone, wallet and the Switch while you're on the water.","crit":true},{"id":"cubes","name":"Packing cubes","cat":"kit","bag":"CB","qty":4,"g":220,"fate":"always","note":"What makes the Phuket repack take twenty minutes instead of two hours.","crit":true},{"id":"sunglasses","name":"Sunglasses — 4 pairs, one case","cat":"kit","bag":"CB","qty":4,"g":400,"fate":"always","note":"Trimmed from eight. Keep one cheap pair for the water and the longtails — that is the pair that gets lost.","crit":true},{"id":"locks","name":"TSA padlocks","cat":"kit","bag":"CB","qty":3,"g":150,"fate":"always","note":"Three bags go in the Jetstar hold and two sit in storage for 13 days.","crit":true},{"id":"scales","name":"Luggage scales","cat":"kit","bag":"CB","qty":1,"g":100,"fate":"always","note":"You have a live 7 kg problem on TG206. Pays for itself once.","crit":true},{"id":"laundry-bag","name":"Laundry bag","cat":"kit","bag":"CB","qty":1,"g":80,"fate":"always","note":"Thai laundry charges by the kilo; bagged is faster to drop off.","crit":false},{"id":"notepad","name":"Thai notepad","cat":"kit","bag":"SL","qty":1,"g":90,"fate":"always","note":"","crit":false},{"id":"daypack","name":"Lockable daypack","cat":"kit","bag":"CB","qty":1,"g":320,"fate":"always","note":"Rottnest, the ferries and Bangkok. Lockable zips and a slash-resistant strap.","crit":true},{"id":"trainers-nice","name":"Nice trainers","cat":"footwear","bag":"CB","qty":1,"g":780,"fate":"always","note":"Your smart-casual pair. Fine at Vertigo and Blue Elephant — long trousers are the part they actually care about.","crit":false},{"id":"trainers-old","name":"Old trainers","cat":"footwear","bag":"L1","qty":1,"g":750,"fate":"store","note":"The pair you don't mind ruining. Perth beaches and anything messy.","crit":false},{"id":"running","name":"Running shoes","cat":"footwear","bag":"CB","qty":1,"g":720,"fate":"always","note":"Gym the whole trip, so these travel onward.","crit":false},{"id":"sandals","name":"Sandals","cat":"footwear","bag":"CB","qty":1,"g":400,"fate":"always","note":"The ones you can walk miles in and get wet — Khao Sok, the piers, Krabi.","crit":true},{"id":"sliders","name":"Sliders","cat":"footwear","bag":"CB","qty":1,"g":280,"fate":"always","note":"Beach, pool, hotel bathrooms.","crit":false},{"id":"shirts-nice","name":"Nice shirts","cat":"clothing","bag":"CB","qty":7,"g":1400,"fate":"always","note":"Dinners, Christmas, Bangkok, and sun cover that still reads as clothing.","crit":false},{"id":"tees","name":"T-shirts","cat":"clothing","bag":"CB","qty":10,"g":1500,"fate":"always","note":"","crit":false},{"id":"shorts","name":"Shorts","cat":"clothing","bag":"CB","qty":5,"g":1000,"fate":"always","note":"","crit":false},{"id":"trousers","name":"Trousers","cat":"clothing","bag":"CB","qty":1,"g":450,"fate":"always","note":"For the two or three nights out — Vertigo, Blue Elephant, Christmas dinner. Elephant pants bought in Thailand cover the temples; shorts cover everything else.","crit":true},{"id":"swim","name":"Swim shorts","cat":"clothing","bag":"CB","qty":2,"g":200,"fate":"always","note":"Two, so one is always dry.","crit":true},{"id":"boxers","name":"Boxers","cat":"clothing","bag":"CB","qty":8,"g":270,"fate":"always","note":"","crit":false},{"id":"socks-white","name":"White socks","cat":"clothing","bag":"CB","qty":8,"g":320,"fate":"always","note":"","crit":false},{"id":"socks-gym","name":"Gym socks","cat":"clothing","bag":"CB","qty":3,"g":120,"fate":"always","note":"","crit":false},{"id":"gym-tops","name":"Gym tops","cat":"clothing","bag":"CB","qty":3,"g":300,"fate":"always","note":"","crit":false},{"id":"gym-shorts","name":"Gym shorts","cat":"clothing","bag":"CB","qty":2,"g":300,"fate":"always","note":"","crit":false},{"id":"belt","name":"Belt","cat":"clothing","bag":"CB","qty":1,"g":150,"fate":"always","note":"","crit":false},{"id":"hoodie","name":"Hoodie","cat":"clothing","bag":"CB","qty":1,"g":520,"fate":"always","note":"Worn on the flight out with the tracksuit bottoms. Also the layer for aircraft air con, the 06:00 Donsak ferry and nights on the lake.","crit":true},{"id":"windbreaker","name":"Windbreaker","cat":"clothing","bag":"CB","qty":1,"g":280,"fate":"always","note":"Packs to nothing. The one thing between you and a British 06:35 landing on 24 January.","crit":true},{"id":"tracksuit","name":"Tracksuit bottoms","cat":"clothing","bag":"CB","qty":1,"g":420,"fate":"always","note":"Worn on the long-haul with the hoodie. Doubles as something to sleep in and to throw on at Khao Sok.","crit":false},{"id":"pyjamas","name":"Qatar pyjamas","cat":"clothing","bag":"CB","qty":1,"g":250,"fate":"always","note":"They don't take them back, so you have them from 19 Nov. Covers sleepwear for the rest of the trip.","crit":false},{"id":"hats","name":"Hats","cat":"clothing","bag":"CB","qty":3,"g":300,"fate":"always","note":"","crit":false},{"id":"hat-gym","name":"Gym hat","cat":"clothing","bag":"CB","qty":1,"g":100,"fate":"always","note":"","crit":false}],"legs":[{"id":"prep","name":"Before you go","dates":"Nov","where":"Home","bags":"L1 L2 CB BP SL","note":"Everything assembled. The only leg where forgetting something is fixable."},{"id":"out","name":"Outbound long-haul","dates":"19–20 Nov","where":"LGW→DOH→PER","bags":"L1 L2 CB BP SL","note":"QR330 08:40 from Gatwick, QR900 out of Doha. ~26 hrs door to door. Qsuite, so pyjamas and bedding are provided — the sling is your seat-side kit."},{"id":"perth","name":"Perth — the long stay","dates":"20 Nov–18 Dec","where":"The Sebel West Perth","bags":"L1 L2 CB BP SL","note":"Four weeks. Working. Self-service laundry, so wash weekly and live out of the cases. Peak summer — 30–40°C."},{"id":"perth2","name":"Perth — interim","dates":"18–29 Dec","where":"Not booked","bags":"L1 L2 CB BP SL","note":"11 nights still unbooked. Same kit as the Sebel stay."},{"id":"scar","name":"Scarborough — Christmas","dates":"29 Dec–7 Jan","where":"Scarborough house","bags":"L1 L2 CB BP SL","note":"Christmas and New Year with everyone. Hire car from the 29th. Beach Christmas, but one smart evening."},{"id":"jet","name":"Jetstar to Phuket","dates":"7 Jan","where":"PER→HKT, JQ71","bags":"BP SL","note":"07:25 departure. 40 kg checked prepaid, GBP 72.27 — that is the whole allowance, as the Starter fare includes none. Both cases and the cabin bag go in the hold against it. Backpack and sling are your only cabin items: two items, 7 kg combined, weighed at the gate, AUD 110 if you are over."},{"id":"phu","name":"Phuket","dates":"7–10 Jan","where":"Courtyard by Marriott Phuket Town","bags":"L1 L2 CB BP SL","note":"Three nights with everything still in tow. The last leg where you have the cases open."},{"id":"repack","name":"THE REPACK — Phuket","dates":"10 Jan, morning","where":"Courtyard, before TG206","bags":"L1 L2 CB BP SL","note":"Do this here, with space and time, not at an airport. Everything you need for the next 13 days goes into the cabin bag, backpack and sling. Everything else goes into the two cases and gets locked. Both cases are checked on TG206 — 2 bags at 23 kg each, paid. Watch the cabin bag: Thai economy is officially one piece at 7 kg, and you will be carrying three. Keep it near 7 kg and wear the walking shoes. TG206 departs 11:50 — start after breakfast."},{"id":"drop","name":"Land and dump","dates":"10 Jan, 13:20","where":"Suvarnabhumi","bags":"CB BP SL","note":"Booked and paid: Smilelugg, ref 14XIWBX4, two suitcases, 10–23 Jan, GBP 90.26. B Floor — the Airport Rail Link level. From the SA City Line station entrance walk ~50 m past the ticket kiosk to the Smilelugg counter. Straight off TG206, both cases in, photograph the receipt. Your taxi waits 45 min after landing, so there is time — but go directly.","after":"repack"},{"id":"bkk1","name":"Bangkok","dates":"10–13 Jan","where":"Theatre Residence","bags":"CB BP SL","note":"Cabin bag only from here. Smart dress nights — Blue Elephant and the rooftops enforce long trousers and closed shoes, so that kit has to be in the cabin bag, not the cases.","after":"repack"},{"id":"sam","name":"Koh Samui","dates":"13–17 Jan","where":"Hansar Samui Resort","bags":"CB BP SL","note":"Beach and resort. Light kit from here on.","after":"repack"},{"id":"kha","name":"Khao Sok","dates":"17–19 Jan","where":"500 Rai Floating Resort","bags":"CB BP SL","note":"06:00 ferry from Lipa Noi, 2h15 by road, then in by boat. Floating raft house — limited power, properly dark, everything stays damp. Check-out 09:30 on the 19th.","after":"repack"},{"id":"kra","name":"Ao Nang, Krabi","dates":"19–23 Jan","where":"Krabi La Playa Resort","bags":"CB BP SL","note":"Longtails to the beaches soak everything. Free cancellation ended 4 Jan — already paid.","after":"repack"},{"id":"ret","name":"Collect and fly home","dates":"23–24 Jan","where":"KBV→BKK→DOH→LHR","bags":"L1 L2 CB BP SL","note":"TG246 lands 14:10, QR835 departs 18:55 — 4h45 to clear arrivals, collect both cases from Smilelugg on B Floor (ref 14XIWBX4) and re-check. The counter is landside, so you have to come out first. Lands Heathrow 06:35 on the 24th, in January — have something warm reachable."}],"bags":[{"id":"L1","name":"Suitcase 1","note":"Clothing bulk for the seven Perth weeks."},{"id":"L2","name":"Suitcase 2","note":"Full-size toiletries and the big washbag. Room left for what you buy in Australia."},{"id":"CB","name":"Cabin bag","note":"Bag assignment still to be worked out — this is the inventory, not the final packing."},{"id":"BP","name":"Backpack","note":"A cabin item on every flight."},{"id":"SL","name":"Sling bag","note":"Passport, phone, power bank, cards."}],"daybags":[{"id":"rottnest","name":"Rottnest Island","date":"2027-01-02","dates":"Sat 2 Jan","bag":"Lockable daypack","where":"Fremantle → Thomson Bay","note":"Ferry out 09:00 from O'Connor Landing, e-bikes 09:30–15:30 from Pedal & Flipper, ferry back 16:00. Booking 2G6JZV, 3 adults, same-day return — the fare includes the island admission. Be at the terminal by 08:30; boarding closes 08:50.","warn":"Six hours on a bike in peak Australian summer with almost no shade, and you're drinking. This is the single most sunburn-and-dehydration-prone day of the whole trip. The bikes are due back at 15:30 and the last ferry is 16:00 — that is 30 minutes of margin, so do the drinking at Hotel Rottnest at the end, near the jetty, not at a far bay.","items":[{"name":"Water, 2 litres minimum","ref":null,"g":2000,"crit":true,"note":"There are filling stations at Thomson Bay, Geordie Bay and The Basin, but long stretches between them with nothing. Freeze one bottle the night before."},{"name":"Suncream SPF50","ref":"suncream","g":200,"crit":true,"note":"Apply before you leave the ferry, then again at every beach stop. Australian summer UV is genuinely different — this is not the place to ration it."},{"name":"Hat","ref":"cap","g":100,"crit":true,"note":"Has to stay on at bike speed. A cap with a strap, or wear it backwards."},{"name":"Sunglasses","ref":"sunglasses","g":40,"crit":true},{"name":"Swim shorts — worn under","ref":"swim-is","g":100,"crit":true,"note":"Wear them rather than pack them. You'll stop at The Basin, Little Salmon and Parakeet, and changing facilities are thin away from the settlement."},{"name":"Quick-dry towel","ref":"quick-towel","g":180,"crit":true},{"name":"Dry bag, 10L","ref":"drybag","g":150,"crit":true,"note":"Phone, wallet and keys while you swim. Bags are not watched at the bays."},{"name":"Rash vest or light long sleeve","ref":"rashvest","g":200,"note":"Your back and shoulders are pointed at the sun for six hours on a bike. This is the difference between a good evening and a ruined one."},{"name":"Power bank","ref":"powerbank","g":300,"note":"Maps, photos and the return ferry QR all live on your phone."},{"name":"Card and some cash","ref":"cards","g":20,"note":"Hotel Rottnest and the Thomson Bay bakery take cards. Carry a little cash anyway."},{"name":"Snacks","ref":null,"g":200,"note":"Food away from Thomson Bay is essentially nothing. Even with lunch booked, carry something for the middle of the island."},{"name":"Plasters","ref":"plasters","g":30,"note":"Saddle soreness and a blister from wet feet in dry shoes are the two likely ones."},{"name":"Dry shirt for the ferry home","ref":null,"g":150,"note":"You'll be salty, sunburnt and damp at 16:00. The air con on the boat is cold."},{"name":"Ferry booking 2G6JZV","ref":null,"g":0,"crit":true,"note":"Saved offline. Show the barcode to the crew at the vessel."}]}],"shopping":[{"id":"perth","name":"Perth, first few days","when":"From 20 Nov","where":"Coles or Woolworths · Chemist Warehouse · any sports shop","note":"You have seven weeks here and a kitchen at the Sebel, so this is a proper shop, not a top-up. Chemist Warehouse is substantially cheaper than a supermarket for suncream, toiletries and supplements — it's the one worth a dedicated trip.","items":[{"name":"Suncream SPF50+, large","crit":true,"note":"Australian suncream is the best in the world and cheap here. Buy the big bottle and a small one for the bag. This is also what you decant for Thailand."},{"name":"Protein powder","crit":true,"note":"Chemist Warehouse or a sports shop beats the supermarket on price. Buy a tub sized for seven weeks — you won't be taking it to Thailand, so don't over-buy."},{"name":"Toothpaste","note":"You're carrying the brush but not the paste."},{"name":"Shampoo, conditioner, body wash","note":"Only if the toiletries waiting for you don't already cover it."},{"name":"Aftersun or aloe","note":"Perth in December catches everyone once. Cheaper here than regretting it."},{"name":"Laundry pods or sheets","note":"The Sebel is self-service, so you need your own for the first stretch. Thailand is paid-for and you won't need these there."},{"name":"Reusable shopping bag","note":"Supermarkets charge for bags and you're here seven weeks."},{"name":"Breakfast and kitchen basics","note":"You have an apartment at the Sebel until 18 Dec — coffee, milk, cereal, whatever stops you buying breakfast out every day."},{"name":"Insect repellent, if yours is mild","note":"Perth doesn't need much. Buy the serious DEET in Thailand instead, where it's stronger and cheaper."}]},{"id":"thailand","name":"Thailand top-up","when":"From 7 Jan","where":"7-Eleven, Boots or any pharmacy","note":"Deliberately short. Everything here is cheap, everywhere, and carrying it from Australia is pointless — especially with the cases going into storage on the 10th.","items":[{"name":"DEET insect repellent","crit":true,"note":"Stronger and cheaper than anything you'd bring. Khao Sok is jungle on water and the lake is worst at dusk."},{"name":"Suncream top-up","note":"You'll have burned through the decanted 100 ml by Samui."},{"name":"Elephant pants","crit":true,"note":"Your temple trousers. Buy them in Bangkok on the 11th, before the Grand Palace and Wat Phra Kaew — the dress code is enforced at the gate, not politely overlooked."},{"name":"Small dry bag, if you haven't bought one at home","note":"Beach shops in Samui and Krabi sell them everywhere. Needed before Khao Sok on the 17th."},{"name":"Cheap flip-flops","note":"The pair you leave behind. Beach, boat and bathroom."}]}]};

const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function totals(){const t=ITEMS.length,d=ITEMS.filter(isPacked).length;return{t,d,pc:t?Math.round(d/t*100):0}}
function bagStats(id){const in_=ITEMS.filter(i=>bagOf(i)===id);
  return{n:in_.length,done:in_.filter(isPacked).length,g:in_.reduce((a,i)=>a+grams(i),0)}}

async function pull(){
  try{const r=await fetch(`${SB_URL}/rest/v1/pack_state?select=*`,{headers:HDRS,cache:"no-store"});
    if(!r.ok)throw 0;const rows=await r.json();const s={};
    rows.forEach(x=>s[x.iid]={packed:!!x.packed,bag:x.bag||null});
    STATE=s;store.set("pack:state",s);STALE=false;
  }catch(e){STALE=true}
  render();
}
async function push(iid){
  const s=STATE[iid]||{};
  try{await fetch(`${SB_URL}/rest/v1/pack_state`,{method:"POST",
    headers:Object.assign({},HDRS,{"Content-Type":"application/json",Prefer:"resolution=merge-duplicates,return=minimal"}),
    body:JSON.stringify({iid,packed:!!s.packed,bag:s.bag||null})});STALE=false}
  catch(e){STALE=true}
  paintHead();
}
function toggle(id){const s=STATE[id]||(STATE[id]={});s.packed=!s.packed;
  store.set("pack:state",STATE);push(id);render()}
function move(id,bag){const s=STATE[id]||(STATE[id]={});s.bag=bag;
  store.set("pack:state",STATE);push(id);render()}

function paintHead(){
  const{t,d,pc}=totals(), C=2*Math.PI*19;
  const r=document.getElementById("ringv");
  if(r)r.setAttribute("stroke-dasharray",`${(pc/100*C).toFixed(1)} ${C.toFixed(1)}`);
  document.getElementById("ringp").textContent=pc+"%";
  document.getElementById("plab").textContent=d+" of "+t+" packed";
  document.getElementById("pkg").textContent=kg(ITEMS.reduce((a,i)=>a+grams(i),0))+" all in";
  const st=document.getElementById("pstale");
  st.textContent=STALE?"· offline, saved on this device":"";
  st.className=STALE?"stale":"";
}

const tickHTML=i=>`<button class="tick${isPacked(i)?" on":""}" onclick="toggle('${i.id}')" aria-label="packed">
  <svg viewBox="0 0 24 24"><path d="M4 12.5 9.5 18 20 6.5"/></svg></button>`;
const bagSel=i=>`<select class="bagsel" onchange="move('${i.id}',this.value)" onclick="event.stopPropagation()">`+
  BAGS.map(b=>`<option value="${b.id}"${bagOf(i)===b.id?" selected":""}>${esc(b.id)}</option>`).join("")+`</select>`;

function rowHTML(i){
  const tags=[];
  if(i.crit)tags.push('<span class="pill crit">essential</span>');
  if(i.fate==="store")tags.push('<span class="pill store">parks in Bangkok</span>');
  if(i.fate==="buy")tags.push('<span class="pill buy">buy en route</span>');
  if(i.fate==="handover")tags.push('<span class="pill hand">given away in Phuket</span>');
  return `<div class="row${isPacked(i)?" done":""}">${tickHTML(i)}<div class="rbody">
    <div class="rname">${esc(i.name)}${i.qty>1?` <span class="qty">×${i.qty}</span>`:""}</div>
    ${i.note?`<div class="rnote">${esc(i.note)}</div>`:""}
    <div class="rfoot">${bagSel(i)}${tags.join("")}</div></div></div>`;
}
