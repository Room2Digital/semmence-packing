<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Packing — Australia &amp; Thailand</title>
<meta name="theme-color" content="#0d0d0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Packing">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<style>html,body{margin:0;background:#0d0d0d;color:#f5f3ee}</style>
<style>
:root{
  color-scheme:dark;
  --page:#0d0d0d; --surface:#17171a; --surface-2:#1f1f23; --raised:#26262b;
  --ink:#fff; --ink-2:#c7c6cc; --muted:#8b8a93; --grid:#2c2c32; --baseline:#3a3a42;
  --ring:rgba(255,255,255,.09);
  --blue:#4a9eff; --green:#2bb673; --violet:#9b8cf4; --orange:#ff7a45; --pink:#f0608d;
  --good:#2bb673; --warn:#ff7a45;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:clip;-webkit-text-size-adjust:100%}
body{background:var(--page);color:var(--ink);font-family:var(--font);line-height:1.45;
  -webkit-font-smoothing:antialiased;padding-bottom:calc(80px + var(--sab));
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:50;background:rgba(13,13,13,.9);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--grid);padding:calc(12px + var(--sat)) 0 12px}
.hrow{display:flex;align-items:center;gap:15px}
.kicker{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:650}
h1{font-size:21px;font-weight:800;letter-spacing:-.02em;margin-top:3px;line-height:1.15}
h1 .b{color:var(--blue)} h1 .o{color:var(--orange)}
.ring{flex:0 0 auto;position:relative;width:60px;height:60px}
.ring svg{transform:rotate(-90deg)}
.ring .tr{stroke:var(--surface-2)}
.ring .va{stroke:var(--good);stroke-linecap:round;transition:stroke-dasharray .5s cubic-bezier(.4,0,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:800;letter-spacing:-.02em}
.hsub{display:flex;align-items:center;gap:9px;margin-top:9px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.hsub .dot{width:3px;height:3px;border-radius:50%;background:var(--baseline)}
.stale{color:var(--warn)}

/* ---------- nav ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;justify-content:center;
  background:rgba(13,13,13,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--grid);padding-bottom:var(--sab)}
nav button{flex:1;max-width:160px;background:none;border:0;color:var(--muted);font:650 10px var(--font);
  letter-spacing:.03em;padding:10px 2px 11px;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:4px;border-top:2px solid transparent;margin-top:-1px;transition:color .15s}
nav button[aria-current="true"]{color:var(--ink);border-top-color:var(--blue)}
nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
main{padding-top:18px}

/* ---------- structure ---------- */
.sec{margin-bottom:30px}
.sg-head{display:flex;align-items:baseline;gap:10px;margin-bottom:13px}
h2{font-size:17px;font-weight:750;letter-spacing:-.015em}
.n{font-size:12px;color:var(--muted)}
.label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
  font-weight:700;margin:24px 0 10px}
.card{background:var(--surface);border:1px solid var(--ring);border-radius:var(--r);padding:16px 17px}
.note{font-size:13px;color:var(--ink-2);line-height:1.5}
.center{text-align:center;color:var(--muted);padding:46px 20px;font-size:13.5px}

/* ---------- bag cards ---------- */
.baggrid{display:grid;gap:11px}
.bagcard{display:block;width:100%;text-align:left;position:relative;overflow:hidden;
  background:var(--surface);border:1px solid var(--ring);border-radius:var(--r);
  padding:16px 17px 15px;color:inherit;font:inherit;cursor:pointer;
  transition:transform .13s,border-color .15s,background .15s}
.bagcard:active{transform:scale(.988)}
.bagcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--bc)}
.bagcard::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 0% 0%,color-mix(in srgb,var(--bc) 13%,transparent),transparent 62%)}
.bagtop{display:flex;align-items:flex-start;gap:12px;position:relative;z-index:1}
.bagic{flex:0 0 auto;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--bc) 18%,transparent);
  border:1px solid color-mix(in srgb,var(--bc) 32%,transparent);font-size:19px}
.bagph{flex:0 0 auto;width:58px;height:58px;border-radius:13px;overflow:hidden;background:#f4f4f2;
  border:1px solid color-mix(in srgb,var(--bc) 34%,transparent);
  box-shadow:0 1px 0 color-mix(in srgb,var(--bc) 18%,transparent)}
.bagph img{width:100%;height:100%;object-fit:cover;display:block}
.bagph.noimg{background:color-mix(in srgb,var(--bc) 18%,transparent)}
.bagph.noimg img{display:none}
.bagname{font-size:15.5px;font-weight:700;letter-spacing:-.015em}
.bagmeta{font-size:12px;color:var(--muted);margin-top:2px}
.bagpill{flex:0 0 auto;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;
  padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--ring)}
.bagpill.done{background:color-mix(in srgb,var(--good) 18%,transparent);color:#6ee7a8;
  border-color:color-mix(in srgb,var(--good) 36%,transparent)}
.fill{height:4px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:13px;position:relative;z-index:1}
.fill i{display:block;height:100%;border-radius:999px;background:var(--bc);transition:width .45s cubic-bezier(.4,0,.2,1)}
.bagnote{font-size:12.5px;color:var(--ink-2);line-height:1.45;margin-top:11px;position:relative;z-index:1}

/* ---------- item rows ---------- */
.catline{display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted);font-weight:700;margin:22px 0 4px}
.catline:first-child{margin-top:4px}
.catline span{flex:1;height:1px;background:var(--grid)}
.row{display:flex;gap:13px;align-items:flex-start;padding:13px 2px;border-bottom:1px solid var(--grid)}
.row:last-child{border-bottom:0}
.tick{flex:0 0 auto;width:24px;height:24px;margin-top:1px;border-radius:7px;
  border:1.5px solid var(--baseline);background:var(--surface-2);cursor:pointer;
  display:grid;place-items:center;transition:.18s}
.tick:active{transform:scale(.9)}
.tick.on{background:var(--good);border-color:var(--good)}
.tick svg{width:13px;height:13px;stroke:#fff;stroke-width:3.2;fill:none;opacity:0;
  stroke-linecap:round;stroke-linejoin:round;transition:opacity .15s}
.tick.on svg{opacity:1}
.rbody{flex:1;min-width:0}
.rname{font-size:14.5px;display:flex;flex-wrap:wrap;gap:7px;align-items:baseline;line-height:1.35}
.row.done .rname{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--baseline)}
.qty{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.rnote{font-size:12.5px;color:var(--ink-2);margin-top:5px;line-height:1.5}
.row.done .rnote{color:var(--muted)}
.rfoot{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;align-items:center}
.pill{font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:999px;
  background:var(--surface-2);color:var(--ink-2);border:1px solid var(--ring);white-space:nowrap}
.pill.crit{background:rgba(240,96,141,.14);color:#ff9bbb;border-color:rgba(240,96,141,.34)}
.pill.store{background:rgba(155,140,244,.14);color:#c0b4ff;border-color:rgba(155,140,244,.32)}
.pill.buy{background:rgba(74,158,255,.14);color:#8cc4ff;border-color:rgba(74,158,255,.32)}
.pill.hand{background:rgba(43,182,115,.14);color:#6ee7a8;border-color:rgba(43,182,115,.32)}
.bagsel{font:inherit;font-size:10.5px;font-weight:600;background:var(--surface-2);color:var(--ink-2);
  border:1px solid var(--ring);border-radius:999px;padding:3px 8px;cursor:pointer}

/* ---------- legs timeline ---------- */
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:7px;top:10px;bottom:10px;width:2px;
  background:linear-gradient(180deg,var(--grid),var(--baseline),var(--grid))}
.legcard{position:relative;background:var(--surface);border:1px solid var(--ring);
  border-radius:14px;padding:14px 15px;margin-bottom:10px;cursor:pointer;transition:border-color .15s}
.legcard:active{transform:scale(.99)}
.legcard::before{content:"";position:absolute;left:-23px;top:19px;width:10px;height:10px;
  border-radius:50%;background:var(--baseline);border:2px solid var(--page)}
.legcard.key{border-color:rgba(255,122,69,.4);background:linear-gradient(160deg,rgba(255,122,69,.07),var(--surface) 60%)}
.legcard.key::before{background:var(--orange);box-shadow:0 0 0 3px rgba(255,122,69,.18)}
.legtop{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.legname{font-size:14.5px;font-weight:700;letter-spacing:-.01em}
.legdate{font-size:11.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.legwhere{font-size:12px;color:var(--blue);margin-top:2px}
.legcard.key .legwhere{color:var(--orange)}
.legnote{font-size:12.5px;color:var(--ink-2);margin-top:9px;line-height:1.5}
.bagchips{display:flex;gap:5px;margin-top:11px;flex-wrap:wrap}
.chip{font-size:9.5px;font-weight:700;letter-spacing:.06em;padding:3px 7px;border-radius:6px;
  background:var(--surface-2);color:var(--baseline);border:1px solid var(--grid)}
.chip.has{background:rgba(74,158,255,.15);color:#8cc4ff;border-color:rgba(74,158,255,.32)}
.legvia{font-size:11.5px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.legmodes{display:flex;gap:5px;margin-top:11px;flex-wrap:wrap}

/* ---------- sashes: cabin / checked / with you / worn ---------- */
.sash{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  padding:3px 8px;border-radius:6px;border:1px solid transparent;white-space:nowrap}
.sash.cabin,.chip.cabin{background:rgba(74,158,255,.17);color:#8cc4ff;border-color:rgba(74,158,255,.36)}
.sash.checked,.chip.checked{background:rgba(255,122,69,.17);color:#ffa278;border-color:rgba(255,122,69,.38)}
.sash.with,.chip.with{background:rgba(93,214,146,.15);color:#7fe0ad;border-color:rgba(93,214,146,.34)}
.sash.worn,.chip.worn{background:rgba(191,140,255,.15);color:#c9a6ff;border-color:rgba(191,140,255,.34)}
.sash.left,.chip.left{background:var(--surface-2);color:var(--baseline);border-color:var(--grid)}
.chip.cabin,.chip.checked,.chip.with,.chip.worn{font-weight:700;letter-spacing:.06em}

/* ---------- bag tiles inside a leg ---------- */
.btiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.btile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:8px;
  background:var(--surface);border:1px solid var(--ring);border-radius:15px;padding:13px 13px 14px;
  color:inherit;font:inherit;text-align:left;cursor:pointer;overflow:hidden;
  transition:transform .13s,border-color .15s}
.btile:active{transform:scale(.985)}
.btile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--bc)}
.btile.off{opacity:.45}
.btile-ph{width:100%;aspect-ratio:1/1;border-radius:11px;overflow:hidden;background:#f4f4f2;
  display:grid;place-items:center;border:1px solid color-mix(in srgb,var(--bc) 30%,transparent)}
.btile-ph img{width:100%;height:100%;object-fit:cover;display:block}
.btile-ph.noimg{background:color-mix(in srgb,var(--bc) 16%,transparent)}
.btile-ph.noimg img{display:none}
.btile-ph i{font-size:30px;font-style:normal}
.btile-n{font-size:13.5px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.btile-m{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:-4px}
.btile-f{display:block;width:100%;height:3px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.btile-f i{display:block;height:100%;border-radius:999px;background:var(--bc)}

/* ---------- repack ---------- */
.split{display:grid;gap:12px}
.col{background:var(--surface);border:1px solid var(--ring);border-radius:var(--r);padding:16px 17px}
.col.stay{border-color:rgba(155,140,244,.32);background:linear-gradient(170deg,rgba(155,140,244,.07),var(--surface) 58%)}
.col.come{border-color:rgba(43,182,115,.32);background:linear-gradient(170deg,rgba(43,182,115,.07),var(--surface) 58%)}
.colhead{font-size:14px;font-weight:750;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.colsub{font-size:11.5px;color:var(--muted);margin:4px 0 13px}
.mini{font-size:13px;padding:8px 0;border-bottom:1px solid var(--grid);display:flex;
  justify-content:space-between;gap:10px;align-items:baseline}
.mini:last-child{border-bottom:0}
.mini b{font-weight:500;color:var(--ink)}
.mini span{color:var(--muted);font-size:10.5px;font-weight:700;letter-spacing:.05em;white-space:nowrap}

/* ---------- callouts ---------- */
.alert{border-radius:var(--r);padding:15px 16px;margin-bottom:16px;
  background:rgba(255,122,69,.09);border:1px solid rgba(255,122,69,.32)}
.alert b{color:var(--orange);font-size:14px;letter-spacing:-.01em}
.alert p{font-size:12.5px;color:var(--ink-2);margin-top:6px;line-height:1.55}
.alert.info{background:rgba(74,158,255,.08);border-color:rgba(74,158,255,.28)}
.alert.info b{color:var(--blue)}

/* ---------- day bags ---------- */
.daycard{display:block;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--ring);border-radius:var(--r);padding:16px 17px;color:inherit;font:inherit;
  cursor:pointer;position:relative;overflow:hidden;transition:transform .13s}
.daycard:active{transform:scale(.988)}
.daycard::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 100% 0%,rgba(255,122,69,.12),transparent 60%)}
.dayhead{display:flex;justify-content:space-between;gap:12px;align-items:baseline;position:relative;z-index:1}

/* ---------- misc ---------- */
.search{width:100%;background:var(--surface);border:1px solid var(--ring);border-radius:12px;
  color:var(--ink);font:inherit;font-size:15px;padding:12px 14px;margin-bottom:16px}
.search::placeholder{color:var(--muted)}
.back{background:none;border:0;color:var(--blue);font:inherit;font-size:13.5px;font-weight:600;
  cursor:pointer;padding:6px 0;margin-bottom:10px;display:flex;align-items:center;gap:5px}
.addrow{display:flex;gap:9px;margin-top:13px}
.addrow input{flex:1;background:var(--surface-2);border:1px solid var(--ring);border-radius:10px;
  color:var(--ink);font:inherit;font-size:14px;padding:10px 12px}
.addrow button{background:var(--blue);border:0;color:#fff;font:inherit;font-size:14px;
  font-weight:700;border-radius:10px;padding:10px 17px;cursor:pointer}

@media(min-width:760px){
  .wrap{max-width:900px;padding:0 26px}
  h1{font-size:26px} h2{font-size:19px}
  .ring{width:70px;height:70px} .ring b{font-size:16px}
  nav button{max-width:170px;font-size:11px}
  .baggrid{grid-template-columns:1fr 1fr;gap:12px}
  .split{grid-template-columns:1fr 1fr}
  .tl{padding-left:30px}
}
@media(min-width:1080px){
  .wrap{max-width:1020px}
  .baggrid{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="hrow">
    <div style="flex:1;min-width:0">
      <div class="kicker">19 Nov 2026 – 24 Jan 2027</div>
      <h1><span class="b">Australia</span> &amp; <span class="o">Thailand</span></h1>
    </div>
    <div class="ring">
      <svg viewBox="0 0 44 44" width="100%" height="100%">
        <circle class="tr" cx="22" cy="22" r="19" fill="none" stroke-width="4"/>
        <circle class="va" id="ringv" cx="22" cy="22" r="19" fill="none" stroke-width="4"
                stroke-dasharray="0 120"/>
      </svg>
      <b id="ringp">0%</b>
    </div>
  </div>
  <div class="hsub">
    <span id="plab">—</span>
    <span class="dot"></span>
    <span id="pkg">—</span>
    <span id="pstale"></span>
  </div>
</div></header>

<main class="wrap" id="view"></main>

<nav id="tabs">
  <button data-t="bags"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span>Bags</span></button>
  <button data-t="legs"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 4 3 14 0 18M12 3c-3 4-3 14 0 18"/></svg><span>Legs</span></button>
  <button data-t="all"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span>All</span></button>
</nav>

<script>
const DATA={"items":[{"id":"passport","name":"Passport \u2014 trackable holder","cat":"docs","bag":"SL","qty":1,"g":60,"fate":"always","note":"Six months' validity beyond 24 Jan 2027. The holder is tracked, so it shows in Find My.","crit":true},{"id":"tdac","name":"Thailand Digital Arrival Card","cat":"docs","bag":"SL","qty":1,"g":0,"fate":"always","note":"Mandatory for every foreign national. Complete it online 4\u20136 Jan, within 3 days of landing in Phuket on the 7th. Needs flight number, the Courtyard's address and a contact mobile. Save the QR offline.","crit":true},{"id":"eta-aus","name":"Australian ETA","cat":"docs","bag":"SL","qty":1,"g":0,"fate":"always","note":"Approved before you fly \u2014 the airline checks it at Gatwick.","crit":true},{"id":"licence","name":"Driving licence \u2014 the physical card","cat":"docs","bag":"SL","qty":1,"g":10,"fate":"store","note":"Avis from 29 Dec. No International Driving Permit needed, a UK licence is already in English \u2014 but hire firms will not accept a photo or a photocopy. Into the stored case at the Phuket repack; you don't drive again.","crit":true},{"id":"insurance","name":"Travel insurance \u2014 policy and 24hr number","cat":"docs","bag":"SL","qty":1,"g":10,"fate":"always","note":"Check the single-article limit before you fly. You are carrying roughly four thousand pounds of Apple hardware and most policies cap any one item at \u00a3300\u2013500.","crit":true},{"id":"cards","name":"Bank cards \u2014 two providers","cat":"docs","bag":"SL","qty":2,"g":20,"fate":"always","note":"Tracker card in the wallet. Split across two bags so one loss isn't total.","crit":true},{"id":"cash-gbp","name":"Cash \u2014 GBP float","cat":"docs","bag":"SL","qty":1,"g":20,"fate":"always","note":"Gatwick, and the taxi home on the 24th.","crit":false},{"id":"cash-thb","name":"Cash \u2014 25,000 THB","cat":"docs","bag":"SL","qty":1,"g":60,"fate":"always","note":"Ordered and paid, ref STM30429677 \u2014 GBP 598.23 at 41.7898. Half the original plan and still comfortable, because most of Thailand is already covered: Khao Sok is fully prepaid apart from the THB 340 park and pier fee, and in Bangkok and Samui the rooms are paid and your parents are picking up most of the rest. So this is really Phuket and Ao Nang money \u2014 food, longtails, taxis, beach days. Top up from an ATM in Bangkok if it runs low. Well under Thailand's declaration threshold (USD 20,000 equivalent), so nothing to declare. Split it \u2014 some in the sling, some in a case, some in the hotel safe. Do not carry the lot in one place for 67 days.","crit":true},{"id":"cash-aud","name":"Cash \u2014 200 AUD","cat":"docs","bag":"SL","qty":1,"g":15,"fate":"always","note":"Ordered and paid, ref STM30429677 \u2014 GBP 109.07 at 1.8337. You said Australia is effectively cashless and you'd made that mistake before, so treat this as an emergency float, not spending money: a cab that won't take cards, a tip, Rottnest, a market stall at Fremantle. Keep a twenty on you and the rest in the case. It is dead weight after 7 Jan \u2014 spend it or give it away before you fly to Phuket.","crit":false},{"id":"flights-off","name":"All 8 flight confirmations \u2014 offline","cat":"docs","bag":"SL","qty":1,"g":0,"fate":"always","note":"Saved offline. Phuket and Khao Sok have patchy signal.","crit":true},{"id":"hotels-off","name":"Accommodation confirmations \u2014 offline","cat":"docs","bag":"SL","qty":1,"g":0,"fate":"always","note":"Theatre Residence and the 500 Rai transfer details especially.","crit":false},{"id":"bag-conf","name":"Baggage receipts \u2014 JQ71 and TG206","cat":"docs","bag":"SL","qty":1,"g":0,"fate":"always","note":"JQ71: 40 kg prepaid, GBP 72.27, ref DMF5N5. TG206: 2 \u00d7 23 kg, second bag GBP 15.05, PNR FV844G. Have both at the bag drops.","crit":true},{"id":"storage-receipt","name":"Smilelugg receipt \u2014 14XIWBX4","cat":"docs","bag":"SL","qty":1,"g":5,"fate":"always","note":"Paid, GBP 90.26, two cases, 10\u201323 Jan. B Floor at Suvarnabhumi, the Airport Rail Link level. Without it you are not getting the cases back.","crit":true},{"id":"taxi-conf","name":"Bangkok taxi \u2014 booking 911245279","cat":"docs","bag":"SL","qty":1,"g":0,"fate":"always","note":"Driver contacts you on WhatsApp at +44 7951 592634. Check WhatsApp works on landing.","crit":true},{"id":"phone","name":"Phone","cat":"tech","bag":"SL","qty":1,"g":220,"fate":"always","note":"","crit":true},{"id":"watch","name":"Apple Watch","cat":"tech","bag":"SL","qty":1,"g":50,"fate":"always","note":"","crit":false},{"id":"airpods","name":"AirPods Pro","cat":"tech","bag":"SL","qty":1,"g":60,"fate":"always","note":"Your everyday set once the over-ears are parked.","crit":false},{"id":"sony","name":"Sony over-ear headphones","cat":"tech","bag":"SL","qty":1,"g":250,"fate":"store","note":"Earn their place over the 26 hours out. Into the stored case at the Phuket repack, collected on the 23rd for the flight home.","crit":false},{"id":"ipad-air","name":"iPad Air","cat":"tech","bag":"CB","qty":1,"g":460,"fate":"always","note":"Reading and films. Comes everywhere.","crit":false},{"id":"mba","name":"MacBook Air","cat":"tech","bag":"CB","qty":1,"g":1240,"fate":"store","note":"You work from Perth and stop in Thailand. Into the stored case at the Phuket repack \u2014 it does not need to see Samui or the lake.","crit":true},{"id":"dongle","name":"USB-C dongle","cat":"tech","bag":"CB","qty":1,"g":40,"fate":"store","note":"Stores with the Air.","crit":false},{"id":"mouse","name":"Mouse","cat":"tech","bag":"CB","qty":1,"g":80,"fate":"store","note":"Seven weeks of work earns it. Stores with the Air.","crit":false},{"id":"hdmi","name":"HDMI cable","cat":"tech","bag":"CB","qty":1,"g":90,"fate":"store","note":"General purpose \u2014 hotel TVs, the MacBook. Stores at Phuket.","crit":false},{"id":"hdmi-switch","name":"Nintendo Switch HDMI cable","cat":"tech","bag":"L1","qty":1,"g":80,"fate":"store","note":"Travels with the Switch.","crit":false},{"id":"ps5-pad","name":"PS5 controller","cat":"tech","bag":"L1","qty":1,"g":280,"fate":"store","note":"For Remote Play. Qatar's Starlink should genuinely carry it \u2014 the bandwidth is there and satellite latency is usually workable. Worth testing on the Gatwick to Doha leg before you count on it for the 14 hours to Perth. Pairs natively with the iPad Air as the fallback.","crit":false},{"id":"switch","name":"Nintendo Switch","cat":"tech","bag":"L1","qty":1,"g":400,"fate":"store","note":"Stays in the stored cases 10\u201323 Jan, then into the cabin bag at Bangkok for the flight home.","crit":false},{"id":"charger-mac","name":"MacBook charger \u2014 high wattage","cat":"tech","bag":"CB","qty":1,"g":300,"fate":"store","note":"Check the wattage covers the Air. The fold-up 3-in-1 will not charge a laptop.","crit":true},{"id":"plug-uk","name":"Mains plug \u2014 UK","cat":"tech","bag":"CB","qty":1,"g":90,"fate":"always","note":"","crit":false},{"id":"adapter-universal","name":"Travel adapter with USB-C","cat":"tech","bag":"CB","qty":1,"g":180,"fate":"always","note":"UK Type G, Australia Type I, Thailand A/C. Check it is rated for the laptop charger, not just phones.","crit":true},{"id":"charger-3in1","name":"Fold-up 3-in-1 charger","cat":"tech","bag":"SL","qty":1,"g":180,"fate":"always","note":"Watch, phone and AirPods from one plug. The best single item in the sling.","crit":false},{"id":"cable-ext","name":"Extendable USB-C cable","cat":"tech","bag":"SL","qty":1,"g":70,"fate":"always","note":"","crit":false},{"id":"cable-shaver","name":"Shaver cable","cat":"tech","bag":"CB","qty":1,"g":40,"fate":"always","note":"Not USB-C at both ends, so nothing else in the bag will charge it. The one cable with no substitute \u2014 pack it with the shaver, not loose.","crit":true},{"id":"brick-sm","name":"Power bank \u2014 small","cat":"tech","bag":"SL","qty":1,"g":200,"fate":"always","note":"The only one you are taking \u2014 the large one is out. Cabin baggage only, never checked.","crit":true},{"id":"esim","name":"Global SIM \u2014 2 months","cat":"tech","bag":"SL","qty":1,"g":0,"fate":"always","note":"Already organised. Covers both countries for the whole trip, so no Australian or Thai eSIM needed on arrival.","crit":false},{"id":"airtags","name":"AirTags","cat":"tech","bag":"CB","qty":5,"g":55,"fate":"always","note":"On the tech bag, sling, backpack and both cases. Get the fifth so suitcase 2 is covered \u2014 it sits in third-party storage for 13 days.","crit":true},{"id":"mouthtape","name":"Mouth tape","cat":"flight","bag":"SL","qty":1,"g":20,"fate":"always","note":"","crit":false},{"id":"eyemask","name":"Eye mask","cat":"flight","bag":"SL","qty":1,"g":30,"fate":"always","note":"QR835 is an overnight and QR107 lands at 06:35.","crit":false},{"id":"earplugs","name":"Earplugs","cat":"flight","bag":"SL","qty":1,"g":10,"fate":"always","note":"","crit":false},{"id":"snacks","name":"Snacks for travel days","cat":"flight","bag":"SL","qty":1,"g":150,"fate":"always","note":"","crit":false},{"id":"washbag-lg","name":"Fold-out washbag \u2014 large","cat":"toiletries","bag":"L2","qty":1,"g":260,"fate":"store","note":"Lives in the suitcase. Into storage at the Phuket repack.","crit":false},{"id":"washbag-mini","name":"Mini washbags","cat":"toiletries","bag":"CB","qty":2,"g":80,"fate":"always","note":"The hand-luggage pair. These are what you actually use on travel days and at the lake.","crit":true},{"id":"liquids-bag","name":"Clear 1L liquids bag","cat":"toiletries","bag":"SL","qty":1,"g":20,"fate":"always","note":"Re-cleared at Perth, Phuket, Bangkok and Krabi. Keep it reachable.","crit":true},{"id":"decant","name":"Decant bottles, 100 ml","cat":"toiletries","bag":"CB","qty":5,"g":150,"fate":"always","note":"Fill these at the Phuket repack. For the lake you really only need suncream and the basics \u2014 Hansar, Krabi La Playa and Theatre Residence all provide the rest.","crit":true},{"id":"suncream","name":"Suncream \u2014 full size","cat":"toiletries","bag":"L2","qty":1,"g":200,"fate":"always","note":"Australian suncream is the best there is and cheap. Decant 100 ml for the onward leg.","crit":true},{"id":"suncream-tr","name":"Travel suncream","cat":"toiletries","bag":"SL","qty":1,"g":80,"fate":"always","note":"For the plane and the first day before you buy properly.","crit":false},{"id":"facewash","name":"Travel facewash","cat":"toiletries","bag":"CB","qty":1,"g":90,"fate":"always","note":"","crit":false},{"id":"moisturiser","name":"Moisturiser","cat":"toiletries","bag":"CB","qty":1,"g":100,"fate":"always","note":"Cabin bag on both long-hauls. Three sectors of dry cabin air each way.","crit":true},{"id":"eyecream","name":"Eye cream","cat":"toiletries","bag":"CB","qty":1,"g":40,"fate":"always","note":"","crit":false},{"id":"sanitiser","name":"Hand sanitiser","cat":"toiletries","bag":"SL","qty":1,"g":60,"fate":"always","note":"","crit":false},{"id":"mozzie","name":"Mosquito spray","cat":"toiletries","bag":"CB","qty":1,"g":120,"fate":"always","note":"Khao Sok is jungle on water and the lake is worst at dusk. Top up with stronger DEET in Thailand if yours is mild.","crit":true},{"id":"shaver","name":"Electric shaver","cat":"toiletries","bag":"CB","qty":1,"g":220,"fate":"always","note":"Cabin bag on both long-hauls \u2014 you want a shave before landing in Perth and again before Heathrow. Lithium batteries belong in the cabin anyway, not the hold.","crit":true},{"id":"shave-foam","name":"Mini shaving foam","cat":"toiletries","bag":"CB","qty":1,"g":100,"fate":"always","note":"Under 100 ml, so it lives in the clear liquids bag. Cabin bag on both long-hauls.","crit":true},{"id":"toothpaste-mini","name":"Mini toothpaste","cat":"toiletries","bag":"CB","qty":1,"g":40,"fate":"always","note":"For the Gatwick night and the flight. Full size bought in Perth.","crit":true},{"id":"etoothbrush","name":"Electric toothbrush","cat":"toiletries","bag":"CB","qty":1,"g":180,"fate":"always","note":"Toothpaste bought on arrival; Qatar give you a travel one for the flight. Check the charger \u2014 most are an inductive base with a fixed plug, which needs the travel adapter.","crit":true},{"id":"deodorant","name":"Roll-on deodorant","cat":"toiletries","bag":"CB","qty":3,"g":300,"fate":"always","note":"One lives in the mini washbag for the flight; two spares in the main toiletries. Roll-on is not a liquid for cabin purposes and does not leak at altitude.","crit":true},{"id":"aftershave","name":"Aftershave atomiser","cat":"toiletries","bag":"CB","qty":1,"g":60,"fate":"always","note":"One small atomiser covers all 67 days and clears cabin liquids without a thought.","crit":false},{"id":"lipbalm","name":"Lip balm with SPF","cat":"toiletries","bag":"SL","qty":1,"g":15,"fate":"always","note":"Six hours cycling at Rottnest, a lot of beach, and three long-haul sectors of dry cabin air.","crit":false},{"id":"nail","name":"Nail clippers","cat":"toiletries","bag":"CB","qty":1,"g":40,"fate":"always","note":"Fine in checked. Cabin rules on clippers vary by airport.","crit":false},{"id":"medkit","name":"Small medical pouch","cat":"health","bag":"CB","qty":1,"g":60,"fate":"always","note":"","crit":false},{"id":"imodium","name":"Imodium","cat":"health","bag":"CB","qty":1,"g":20,"fate":"always","note":"The 06:00 ferry on the 17th, then 2h15 by road to the lake. You cannot buy this at 5am on a pier.","crit":true},{"id":"motion","name":"Motion sickness tablets","cat":"health","bag":"CB","qty":1,"g":20,"fate":"always","note":"Samui to Donsak is 1h30 of open water. Take one before boarding, not when you feel it.","crit":true},{"id":"paracetamol","name":"Paracetamol","cat":"health","bag":"CB","qty":1,"g":40,"fate":"always","note":"","crit":false},{"id":"ibuprofen","name":"Ibuprofen","cat":"health","bag":"CB","qty":1,"g":40,"fate":"always","note":"","crit":false},{"id":"antihistamine","name":"Antihistamine","cat":"health","bag":"CB","qty":1,"g":20,"fate":"always","note":"Bites, heat rash, unfamiliar food.","crit":false},{"id":"antiseptic","name":"Antiseptic cream","cat":"health","bag":"CB","qty":1,"g":40,"fate":"always","note":"Coral and scooter scrapes infect fast in the tropics.","crit":true},{"id":"plasters","name":"Plasters + blister plasters","cat":"health","bag":"CB","qty":1,"g":50,"fate":"always","note":"Blister plasters specifically \u2014 new sandals and a lot of walking.","crit":true},{"id":"rehydration","name":"Rehydration sachets","cat":"health","bag":"CB","qty":6,"g":60,"fate":"always","note":"Heat, beer and stomach trouble. Tiny and cheap.","crit":false},{"id":"athletes","name":"Athlete's foot cream","cat":"health","bag":"CB","qty":1,"g":50,"fate":"always","note":"Humidity, flip-flops, wet bathrooms.","crit":false},{"id":"prescriptions","name":"Prescription medication","cat":"health","bag":"SL","qty":1,"g":100,"fate":"always","note":"Enough for 67 days plus buffer, in original packaging, in hand luggage.","crit":true},{"id":"mbp","name":"MacBook Pro \u2014 for handover","cat":"tech","bag":"CB","qty":1,"g":1600,"fate":"handover","note":"Given away in Phuket, 7\u201310 Jan. Sign out of your Apple ID and erase it BEFORE you fly \u2014 doing that over hotel wifi with a deadline is miserable. Remove it from Find My or it stays activation-locked and useless to them.","crit":true},{"id":"ipad-mini","name":"iPad mini \u2014 for handover","cat":"tech","bag":"CB","qty":1,"g":300,"fate":"handover","note":"Same: signed out, erased and removed from Find My before you fly.","crit":true},{"id":"larq","name":"Larq bottle, 1L","cat":"kit","bag":"BP","qty":1,"g":500,"fate":"always","note":"Self-cleaning, so it earns itself in Thailand. Empty through security, fill after.","crit":true},{"id":"towel-lg","name":"Microfibre towel \u2014 large","cat":"kit","bag":"L1","qty":1,"g":300,"fate":"store","note":"Beach days in Perth. Stores at Phuket.","crit":false},{"id":"towel-sm","name":"Microfibre towel \u2014 mini","cat":"kit","bag":"CB","qty":1,"g":120,"fate":"always","note":"The one that matters onward \u2014 ferries, the lake, Krabi longtails.","crit":true},{"id":"drybag","name":"Dry bag, small \u2014 TO BUY","cat":"kit","bag":"BP","qty":1,"g":120,"fate":"buy","note":"Not owned yet. Khao Sok arrives by boat, the ferry deck is wet and Krabi longtails soak everything. Phone, wallet and the Switch while you're on the water.","crit":true},{"id":"cubes","name":"Packing cubes","cat":"kit","bag":"CB","qty":4,"g":220,"fate":"always","note":"What makes the Phuket repack take twenty minutes instead of two hours.","crit":true},{"id":"sunglasses","name":"Sunglasses \u2014 4 pairs in a travel case","cat":"kit","bag":"L1","qty":4,"g":400,"fate":"store","note":"The travel case lives in the suitcase. Include the cheap pairs here \u2014 these are the ones for the water and the longtails.","crit":true},{"id":"sunglasses-daily","name":"Sunglasses \u2014 daily pair","cat":"kit","bag":"SL","qty":1,"g":120,"fate":"always","note":"On you, in a normal case. The only pair that travels past Bangkok.","crit":true},{"id":"locks","name":"TSA padlocks","cat":"kit","bag":"CB","qty":3,"g":150,"fate":"always","note":"Three bags go in the Jetstar hold and two sit in storage for 13 days.","crit":true},{"id":"scales","name":"Luggage scales","cat":"kit","bag":"CB","qty":1,"g":100,"fate":"always","note":"You have a live 7 kg problem on TG206. Pays for itself once.","crit":true},{"id":"laundry-bag","name":"Dirty laundry bags","cat":"kit","bag":"CB","qty":2,"g":110,"fate":"always","note":"Two, so dirty and damp stay apart from clean. Thai laundry charges by the kilo and bagged is faster to drop off.","crit":false},{"id":"binbags","name":"Bin bags","cat":"kit","bag":"CB","qty":5,"g":60,"fate":"always","note":"Wet swimwear, sandy shoes, the shirt you sweated through on the ferry. Weigh nothing and solve a problem every few days.","crit":false},{"id":"goggles","name":"Swimming goggles","cat":"kit","bag":"CB","qty":1,"g":80,"fate":"buy","note":"Worth having \u2014 the Sebel and the office both have gyms, and there is a lot of sea between Scarborough, Samui and Krabi.","crit":false},{"id":"apps","name":"Phone apps page","cat":"docs","bag":"SL","qty":1,"g":0,"fate":"always","note":"Airlines, TripIt, Avios, Amex, Monzo, Booking.com, Grab, Uber, Uber Eats, Ticketmaster. Add WhatsApp \u2014 the Bangkok driver contacts you on it \u2014 plus Line, which is how Thai businesses actually communicate, and GetYourGuide for the Rottnest ferry booking.","crit":false},{"id":"notepad","name":"Thai notepad","cat":"kit","bag":"SL","qty":1,"g":90,"fate":"always","note":"","crit":false},{"id":"daypack","name":"Lockable daypack","cat":"kit","bag":"CB","qty":1,"g":320,"fate":"always","note":"Rottnest, the ferries and Bangkok. Lockable zips and a slash-resistant strap.","crit":true},{"id":"trainers-nice","name":"Nice trainers","cat":"footwear","bag":"CB","qty":1,"g":780,"fate":"always","note":"Your smart-casual pair. Fine at Vertigo and Blue Elephant \u2014 long trousers are the part they actually care about.","crit":false},{"id":"trainers-old","name":"Old trainers","cat":"footwear","bag":"L1","qty":1,"g":750,"fate":"store","note":"The pair you don't mind ruining. Perth beaches and anything messy.","crit":false},{"id":"running","name":"Running shoes","cat":"footwear","bag":"CB","qty":1,"g":720,"fate":"always","note":"Gym the whole trip, so these travel onward.","crit":false},{"id":"sandals","name":"Sandals","cat":"footwear","bag":"CB","qty":1,"g":400,"fate":"always","note":"The ones you can walk miles in and get wet \u2014 Khao Sok, the piers, Krabi.","crit":true},{"id":"sliders","name":"Sliders","cat":"footwear","bag":"CB","qty":1,"g":280,"fate":"always","note":"Beach, pool, hotel bathrooms.","crit":false},{"id":"shirts-nice","name":"Nice shirts","cat":"clothing","bag":"CB","qty":7,"g":1400,"fate":"always","note":"Dinners, Christmas, Bangkok, and sun cover that still reads as clothing.","crit":false},{"id":"tees","name":"T-shirts","cat":"clothing","bag":"CB","qty":10,"g":1500,"fate":"always","note":"","crit":false},{"id":"shorts","name":"Shorts","cat":"clothing","bag":"CB","qty":5,"g":1000,"fate":"always","note":"","crit":false},{"id":"trousers","name":"Trousers","cat":"clothing","bag":"CB","qty":1,"g":450,"fate":"always","note":"For the two or three nights out \u2014 Vertigo, Blue Elephant, Christmas dinner. Elephant pants bought in Thailand cover the temples; shorts cover everything else.","crit":true},{"id":"swim","name":"Swim shorts","cat":"clothing","bag":"CB","qty":2,"g":200,"fate":"always","note":"Two, so one is always dry.","crit":true},{"id":"boxers","name":"Boxers","cat":"clothing","bag":"CB","qty":8,"g":270,"fate":"always","note":"","crit":false},{"id":"socks-white","name":"White socks","cat":"clothing","bag":"CB","qty":8,"g":320,"fate":"always","note":"","crit":false},{"id":"socks-gym","name":"Gym socks","cat":"clothing","bag":"CB","qty":3,"g":120,"fate":"always","note":"","crit":false},{"id":"compression","name":"Compression socks","cat":"clothing","bag":"BP","qty":1,"g":90,"fate":"always","note":"For the long-haul. Worth it on a 26-hour door-to-door and again on the way back.","crit":true},{"id":"gym-tops","name":"Gym tops","cat":"clothing","bag":"CB","qty":3,"g":300,"fate":"always","note":"","crit":false},{"id":"gym-shorts","name":"Gym shorts","cat":"clothing","bag":"CB","qty":2,"g":300,"fate":"always","note":"","crit":false},{"id":"belt","name":"Belt","cat":"clothing","bag":"CB","qty":1,"g":150,"fate":"always","note":"","crit":false},{"id":"hoodie","name":"Hoodie","cat":"clothing","bag":"L1","qty":1,"g":520,"fate":"store","note":"Suitcase, not worn. Note the consequence: the cases sit in Bangkok storage 10\u201323 Jan, so you have no warm layer for the 06:00 Donsak ferry or nights on the lake. You collect it on the 23rd in time for the flight home.","crit":true},{"id":"windbreaker","name":"Windbreaker","cat":"clothing","bag":"CB","qty":1,"g":280,"fate":"always","note":"Packs to nothing. The one thing between you and a British 06:35 landing on 24 January.","crit":true},{"id":"tracksuit","name":"Tracksuit bottoms","cat":"clothing","bag":"L1","qty":1,"g":420,"fate":"store","note":"Suitcase. Back in your hands on the 23rd for the flight home.","crit":false},{"id":"pyjamas","name":"Qatar pyjamas","cat":"clothing","bag":"CB","qty":1,"g":250,"fate":"always","note":"They don't take them back, so you have them from 19 Nov. Covers sleepwear for the rest of the trip.","crit":false},{"id":"hats","name":"Hats","cat":"clothing","bag":"CB","qty":3,"g":300,"fate":"always","note":"","crit":false},{"id":"hat-gym","name":"Gym hat","cat":"clothing","bag":"CB","qty":1,"g":100,"fate":"always","note":"","crit":false}],"legs":[{"id":"lon-per","name":"London \u2013 Perth","dates":"19\u201320 Nov","where":"LGW \u2192 DOH \u2192 PER","via":"QR 330 \u00b7 QR 900 \u00b7 Qatar Business","key":1,"note":"About 26 hours door to door, and it starts at the Gatwick hotel on the 18th \u2014 so the cabin bag has to cover that night without opening a suitcase. Qatar Business gives you 40 kg checked and two cabin pieces at 15 kg plus a personal item, so all three carry-ons travel with you. Qsuite: pyjamas and bedding provided.","do":[{"n":"Erase the MacBook Pro and iPad mini","note":"Sign out of your Apple ID, erase, remove from Find My. An activation-locked device is useless to whoever gets it, and doing this on Phuket hotel wifi with someone waiting is miserable."},{"n":"Collect the Sainsbury's travel money","note":"Order STM30429677 \u2014 THB 25,000 and AUD 200, \u00a3707.30, already paid. Count it at the counter."},{"n":"Buy the small dry bag and the goggles","note":"The last two outstanding items."},{"n":"Check passport validity","note":"Six months beyond 24 Jan 2027."},{"n":"Download offline maps","note":"Perth, Bangkok, Samui, Krabi. Plus WhatsApp, Line, GetYourGuide and Bolt on your apps page."},{"n":"AirTags in both cases","note":"They sit in third-party storage for 13 days later on."}],"bags":[{"bag":"SL","mode":"cabin","items":[{"n":"Passport holder"},{"n":"Wallet and cards"},{"n":"Cash","note":"GBP float plus the Sainsbury's order: THB 25,000 and AUD 200. Split the baht between the sling and a case \u2014 not 25,000 in one pocket. Nothing to declare at either end."},{"n":"Phone"},{"n":"Sunglasses \u2014 daily pair"},{"n":"AirPods Pro"},{"n":"Fold-up 3-in-1 charger"},{"n":"Extendable USB-C cable"},{"n":"Mini charger brick","note":"Cabin only, never checked."},{"n":"Earplugs"},{"n":"Eye mask"},{"n":"Mouth tape"},{"n":"Prescription medication","note":"Hand luggage, original packaging."},{"n":"Clear 1L liquids bag","note":"Cleared twice \u2014 Gatwick and Doha."}],"note":"Everything you cannot replace. It never leaves you."},{"bag":"BP","mode":"cabin","items":[{"n":"iPad Air","note":"The main one, not the one being handed over in Phuket."},{"n":"Sony over-ear headphones","note":"The flight you bought them for."},{"n":"USB-C dongle"},{"n":"HDMI cable"},{"n":"Compression socks","note":"Worth it on a 26-hour door to door."},{"n":"Larq bottle, empty","note":"Fill it after security."}],"note":"The in-flight bag. Under the seat, not in the bin."},{"bag":"CB","mode":"cabin","items":[{"n":"Mini washbag","note":"Electric toothbrush, mini toothpaste, travel face wash, roll-on deodorant, aftershave atomiser. Covers the Gatwick night and the Doha spa at 23:30."},{"n":"Electric shaver and its cable","note":"Cabin, not hold \u2014 lithium batteries belong in the cabin anyway, and you land in Perth at 18:45 after 26 hours."},{"n":"Mini shaving foam","note":"Under 100 ml, so it travels in the clear liquids bag."},{"n":"Moisturiser","note":"Three long-haul sectors of dry cabin air, and a shave at the end of it."},{"n":"2 boxers, 2 socks, 2 T-shirts"},{"n":"1 gym top, 1 gym shorts, 1 gym socks"},{"n":"1 swim shorts"},{"n":"Running shoes"},{"n":"MacBook Air"}],"note":"This bag alone has to get you through the Gatwick night."},{"bag":"L1","mode":"checked","items":[{"n":"The clothing bulk","note":"Shirts, tees, shorts, trousers, boxers, socks \u2014 seven weeks of Perth."},{"n":"Hoodie and tracksuit bottoms","note":"Not worn. You want them for the flight home, not this one."},{"n":"Windbreaker"},{"n":"Travel adapter"},{"n":"4-pair sunglasses case"},{"n":"Sliders, sandals, old trainers"}],"note":""},{"bag":"L2","mode":"checked","items":[{"n":"Full-size toiletries and the big washbag"},{"n":"Towels"},{"n":"MacBook Pro and iPad mini","note":"For the Phuket handover. Already erased and signed out."},{"n":"Switch, PS5 controller and the HDMI cable"},{"n":"Room left deliberately","note":"You are buying suncream, protein powder and the rest in Perth."}],"note":""},{"bag":"worn","mode":"worn","items":[{"n":"Nice trainers","note":"Wear the bulkiest footwear rather than packing it."},{"n":"T-shirt and light trousers","note":"Qatar hand you pyjamas, so do not overthink this."}],"note":""}]},{"id":"per-hkt","name":"Perth \u2013 Phuket","dates":"7 Jan","where":"PER \u2192 HKT","via":"JQ 71 \u00b7 Jetstar \u00b7 07:25","key":1,"note":"Very early start from Scarborough. You have 40 kg of hold baggage prepaid across as many bags as you like, so check all three \u2014 both cases AND the cabin bag \u2014 and walk on with just the backpack and sling. Jetstar cabin is two items, 7 kg combined, and they weigh it at the gate.","do":[{"n":"Pack the night of the 5th","note":"Not the morning of the 7th. The flight is at 07:25."},{"n":"Pre-pack the three cubes","note":"Cube 1 clothing, Cube 2 gym and footwear, Cube 3 kit. This is what makes the Phuket repack ten minutes instead of an hour."},{"n":"Spend or leave the AUD","note":"Australia is behind you. Any Australian cash is dead weight from here."}],"bags":[{"bag":"SL","mode":"cabin","items":[{"n":"Passport, phone, cards, daily sunglasses, AirPods, mini charger brick"},{"n":"The baht","note":"All three bags are checked on this leg. Cash does not go in the hold."},{"n":"Prescriptions and the liquids bag","note":"Never in the hold."}],"note":""},{"bag":"BP","mode":"cabin","items":[{"n":"iPad Air, chargers, Larq"},{"n":"Anything you want in the air","note":"Five and a half hours, no seat-back entertainment worth the name."}],"note":""},{"bag":"CB","mode":"checked","items":[{"n":"Packed as normal","note":"It goes in the hold here \u2014 there is nothing in it you need for five hours, and the prepaid 40 kg covers it."}],"note":"In the hold on this leg only."},{"bag":"L1","mode":"checked","items":[{"n":"Cubes 1, 2 and 3 near the top","note":"You open this case once, in Phuket, and you want the cubes to be the first thing you see."}],"note":""},{"bag":"L2","mode":"checked","items":[{"n":"Everything else"},{"n":"The Perth surplus","note":"Whatever you bought and are keeping."}],"note":""},{"bag":"worn","mode":"worn","items":[{"n":"Trainers and a layer","note":"The plane is cold, Phuket is not."}],"note":""}]},{"id":"hkt-bkk","name":"Phuket \u2013 Bangkok","dates":"10 Jan","where":"HKT \u2192 BKK","via":"TG 206 \u00b7 Thai Airways \u00b7 11:50","key":1,"stored":1,"note":"The tightest leg of the trip. Thai Economy gives you ONE cabin piece at 7 kg, and both checked allowances are taken by the suitcases \u2014 so the cabin bag has to come down under 7 kg before you leave the Courtyard. Land 13:20, then straight to Smilelugg on B Floor: lift the three cubes out of the cases into the cabin bag, lock the cases, hand them over. Ref 14XIWBX4, paid, 10\u201323 Jan.","do":[{"n":"Hand over the MacBook Pro and iPad mini","note":"Early in the three days, not on the morning you leave."},{"n":"Decant the suncream","note":"Fill the 100 ml bottles before the full-size goes into storage for a fortnight."},{"n":"Weigh the cabin bag before you leave the room","note":"Under 7 kg. The only number that matters today."},{"n":"Photograph the Smilelugg receipt","note":"Your taxi waits 45 minutes, so this is not a rush."}],"bags":[{"bag":"SL","mode":"cabin","items":[{"n":"As always","note":"Passport, phone, cards, cash, sunglasses, prescriptions, liquids."}],"note":""},{"bag":"BP","mode":"cabin","items":[{"n":"Your personal item","note":"Thai allow a handbag under 1.5 kg alongside the one cabin piece. Keep it genuinely small today."}],"note":""},{"bag":"CB","mode":"cabin","items":[{"n":"Toiletries \u2014 both mini washbags and the decant bottles","note":"About 1.3 kg."},{"n":"Full health kit","note":"About 0.5 kg."},{"n":"iPad Air, chargers, power bank, shaver and cable","note":"About 1.7 kg."},{"n":"One change of clothes","note":"Insurance only \u2014 you are back into the cases three hours later."},{"n":"TARGET: under 7 kg","note":"Weigh it. Everything else waits in the cubes."}],"note":"Has to be under 7 kg to board. Then it swallows the cubes at BKK."},{"bag":"L1","mode":"checked","items":[{"n":"CUBE 1 \u2014 clothing","note":"5 tees, 3 shorts, 2 nice shirts, 1 trousers, 5 boxers, 3 socks, 2 swim shorts. About 4 kg."},{"n":"CUBE 2 \u2014 gym and footwear","note":"Gym top, shorts, socks, running shoes, sandals, sliders. About 2.5 kg. Shoes in a bin bag inside the cube."},{"n":"CUBE 3 \u2014 kit","note":"Mini towel, dry bag, laundry and bin bags, goggles, daypack, locks. About 1.4 kg."},{"n":"Larq bottle, loose","note":"Too awkward for a cube. Keep it near the top with them."}],"note":"Checked to BKK, then straight into storage \u2014 but the cubes come out first."},{"bag":"L2","mode":"checked","items":[{"n":"Staying behind for 13 days","note":"MacBook Air and its kit, Sony over-ears, Switch, PS5 pad, 4-pair sunglasses case, the Perth clothing surplus, old trainers, hoodie, tracksuit, large washbag, full-size suncream, large towel, driving licence. About 9 kg between the two cases."}],"note":"Checked to BKK, then locked and left at Smilelugg."}]},{"id":"bkk-usm","name":"Bangkok \u2013 Koh Samui","dates":"13 Jan","where":"BKK \u2192 USM","via":"PG 133 \u00b7 Bangkok Airways","stored":1,"note":"Bangkok Airways allow only 5 kg in the cabin, but 20 kg checked is included \u2014 so the cabin bag goes in the hold on this one and you keep the backpack and sling. Leave Theatre Residence by 08:00: check-out is 12:00 but PG 133 does not wait.","do":[{"n":"Buy DEET before you leave Bangkok","note":"Stronger and cheaper here than anything you would have carried from home."},{"n":"Take a motion sickness tablet the night before the 17th","note":"Not for this flight \u2014 for the 06:00 Donsak ferry four days later. Easy to forget once you are on the beach."}],"bags":[{"bag":"SL","mode":"cabin","items":[{"n":"As always"}],"note":""},{"bag":"BP","mode":"cabin","items":[{"n":"Day kit","note":"Dry bag, mini towel, daily sunglasses, suncream, Larq."},{"n":"iPad and chargers","note":"The cabin bag is in the hold, so anything you want on the way travels here."}],"note":""},{"bag":"CB","mode":"checked","items":[{"n":"Packed as it is","note":"5 kg cabin is not worth fighting. It goes in the hold and comes back to you at Samui."}],"note":"In the hold \u2014 cabin is only 5 kg on this airline."},{"bag":"L1","mode":"left","items":[{"n":"At Smilelugg, Bangkok","note":"Collected 23 Jan."}],"note":""},{"bag":"L2","mode":"left","items":[{"n":"At Smilelugg, Bangkok","note":"Collected 23 Jan."}],"note":""}]},{"id":"usm-kha","name":"Koh Samui \u2013 Khao Sok","dates":"17 Jan","where":"Lipa Noi \u2192 Donsak \u2192 Cheow Lan Lake","via":"06:00 ferry \u00b7 2h15 road \u00b7 boat in","key":1,"stored":1,"note":"No airline, so no weight limits \u2014 but two water crossings, and the second one is an open longtail onto the lake. Everything that must stay dry needs to be in the dry bag before you step on the boat, not after. 500 Rai is a raft house: there is no shop, no ATM and no card machine.","do":[{"n":"BOOK THE DONSAK FERRY","note":"Still outstanding. The 06:00 sailing docks 07:30 and leaves real margin; the 07:00 leaves you 25 minutes."},{"n":"Confirm the 500 Rai pick-up time","note":"Do this before you book the ferry, not after."},{"n":"Warn Hansar about the early start","note":"You are leaving before any normal breakfast."},{"n":"Take baht for the park fee","note":"THB 340 at the pier. The stay itself is fully prepaid, so this and any drinks are the only cash you need on the lake \u2014 but there is no card machine, so it has to be in your pocket."}],"bags":[{"bag":"SL","mode":"with","items":[{"n":"On you for both crossings","note":"Passport, cash, phone. Inside the dry bag for the lake boat."}],"note":""},{"bag":"BP","mode":"with","items":[{"n":"Dry bag, packed before the boat","note":"Phone, wallet, iPad. The lake transfer is open water both ways."},{"n":"Mini towel, suncream, DEET, Larq, power bank"}],"note":""},{"bag":"CB","mode":"with","items":[{"n":"Can stay packed","note":"You are on the raft for two nights. There is nothing to lay out."}],"note":""},{"bag":"L1","mode":"left","items":[{"n":"At Smilelugg, Bangkok"}],"note":""},{"bag":"L2","mode":"left","items":[{"n":"At Smilelugg, Bangkok"}],"note":""}]},{"id":"kha-kbv","name":"Khao Sok \u2013 Krabi","dates":"19 Jan","where":"Cheow Lan Lake \u2192 Ao Nang","via":"10:00 boat \u00b7 2.5\u20133 hrs road","stored":1,"note":"Check-out is 09:30 and the boat off the lake is 10:00, with a morning massage booked at 07:30 \u2014 so the bag has to be packed the night before. Then two and a half to three hours by road to Ao Nang.","do":[{"n":"Pack the night of the 18th","note":"The morning is massage, breakfast, boat, in that order, with no slack in it."},{"n":"Settle the 500 Rai extras in cash","note":"Drinks and the park fees. No card machine on the lake."},{"n":"Dry bag again for the boat out","note":"Same crossing, same water."}],"bags":[{"bag":"SL","mode":"with","items":[{"n":"On you"}],"note":""},{"bag":"BP","mode":"with","items":[{"n":"Dry bag with the phone and iPad","note":"Open boat off the lake."}],"note":""},{"bag":"CB","mode":"with","items":[{"n":"Packed the night before","note":"Not on the morning."}],"note":""},{"bag":"L1","mode":"left","items":[{"n":"At Smilelugg, Bangkok"}],"note":""},{"bag":"L2","mode":"left","items":[{"n":"At Smilelugg, Bangkok"}],"note":""}]},{"id":"kbv-bkk","name":"Krabi \u2013 Bangkok","dates":"23 Jan","where":"KBV \u2192 BKK","via":"TG 246 \u00b7 Thai Airways \u00b7 12:45","stored":1,"note":"Check-out is 12:00 and the flight is at 12:45, so leave Ao Nang around 10:00. One checked bag included, which is the cabin bag \u2014 take the pressure off and put it in the hold, because you are collecting two suitcases at the other end anyway.","do":[{"n":"Repack the night of the 22nd","note":"Storage collection and a long-haul on the same day. Do not start this at breakfast."},{"n":"Keep the Smilelugg ref to hand","note":"14XIWBX4. The counter is landside on B Floor, so you clear arrivals first."}],"bags":[{"bag":"SL","mode":"cabin","items":[{"n":"As always"}],"note":""},{"bag":"BP","mode":"cabin","items":[{"n":"iPad, chargers, Larq"}],"note":""},{"bag":"CB","mode":"checked","items":[{"n":"In the hold","note":"One checked bag is included and you have a 4h45 connection to use."}],"note":""},{"bag":"L1","mode":"left","items":[{"n":"Collected at BKK","note":"Not on this flight \u2014 you pick it up at Smilelugg after you land."}],"note":""},{"bag":"L2","mode":"left","items":[{"n":"Collected at BKK"}],"note":""}]},{"id":"bkk-lon","name":"Bangkok \u2013 London","dates":"23\u201324 Jan","where":"BKK \u2192 DOH \u2192 LHR","via":"QR 835 \u00b7 QR 107 \u00b7 Qatar Business","key":1,"note":"TG 246 lands 14:10, QR 835 leaves 18:55 \u2014 4h45 to clear arrivals, collect both cases from Smilelugg on B Floor and re-check everything. Qatar give you 40 kg across any number of bags, so weight is not the problem; time is. Lands Heathrow 06:35 on the 24th, in January, straight off a plane from 30\u00b0C.","do":[{"n":"Collect from Smilelugg first","note":"Ref 14XIWBX4. B Floor, landside, about 50 m past the ticket kiosk from the SA City Line entrance."},{"n":"Pull the hoodie and tracksuit out before you re-check","note":"Heathrow at 06:35 in January. This is the whole reason they came."},{"n":"Keep the shaver, foam and moisturiser in the cabin bag","note":"Thirteen hours to London and a 06:35 landing \u2014 you will want a shave in the Doha lounge."}],"bags":[{"bag":"SL","mode":"cabin","items":[{"n":"As always"},{"n":"Any leftover baht","note":"Spend it airside or keep it for next time."}],"note":""},{"bag":"BP","mode":"cabin","items":[{"n":"Sony over-ears","note":"Back in your hands after 13 days in storage."},{"n":"iPad Air, chargers, Larq"},{"n":"Compression socks"}],"note":""},{"bag":"CB","mode":"cabin","items":[{"n":"Switch, PS5 controller and HDMI","note":"Thirteen hours Bangkok to Doha to London. This is what they are for."},{"n":"Shaver, shaving foam and moisturiser","note":"Do NOT let these go into the cases when you re-check."},{"n":"Shaving foam into the liquids bag","note":"You clear security again at Bangkok and at Doha."},{"n":"One change of clothes"}],"note":""},{"bag":"L1","mode":"checked","items":[{"n":"Re-checked to London","note":"Collected from storage, repacked, straight back in the hold."}],"note":""},{"bag":"L2","mode":"checked","items":[{"n":"Re-checked to London","note":"Everything you are not using on the flight."}],"note":""},{"bag":"worn","mode":"worn","items":[{"n":"Hoodie and tracksuit bottoms","note":"Out of the case before you re-check, not after you land."}],"note":""}]}],"bags":[{"id":"L1","name":"Suitcase 1","img":"img/bag-L1.jpg","note":"Clothing bulk for the seven Perth weeks. Parked with Smilelugg 10\u201323 Jan."},{"id":"L2","name":"Suitcase 2","img":"img/bag-L2.jpg","note":"Full-size toiletries and the big washbag. Room left for what you buy in Australia."},{"id":"CB","name":"Cabin bag","img":"img/bag-CB.jpg","note":"Covers the Gatwick night on its own; your only bag from 10 to 23 Jan."},{"id":"BP","name":"Backpack","img":"img/bag-BP.jpg","note":"A cabin item on every flight."},{"id":"SL","name":"Sling","img":"img/bag-SL.jpg","note":"Passport, phone, mini charger brick, cards, daily sunglasses."}],"daybags":[{"id":"rottnest","name":"Rottnest Island","date":"2027-01-02","dates":"Sat 2 Jan","bag":"Lockable daypack","where":"Fremantle \u2192 Thomson Bay","note":"Ferry out 09:00 from O'Connor Landing, e-bikes 09:30\u201315:30 from Pedal & Flipper, ferry back 16:00. Booking 2G6JZV, 3 adults, same-day return \u2014 the fare includes the island admission. Be at the terminal by 08:30; boarding closes 08:50.","warn":"Six hours on a bike in peak Australian summer with almost no shade, and you're drinking. This is the single most sunburn-and-dehydration-prone day of the whole trip. The bikes are due back at 15:30 and the last ferry is 16:00 \u2014 that is 30 minutes of margin, so do the drinking at Hotel Rottnest at the end, near the jetty, not at a far bay.","items":[{"name":"Water, 2 litres minimum","ref":null,"g":2000,"crit":true,"note":"There are filling stations at Thomson Bay, Geordie Bay and The Basin, but long stretches between them with nothing. Freeze one bottle the night before."},{"name":"Suncream SPF50","ref":"suncream","g":200,"crit":true,"note":"Apply before you leave the ferry, then again at every beach stop. Australian summer UV is genuinely different \u2014 this is not the place to ration it."},{"name":"Hat","ref":"cap","g":100,"crit":true,"note":"Has to stay on at bike speed. A cap with a strap, or wear it backwards."},{"name":"Sunglasses","ref":"sunglasses","g":40,"crit":true},{"name":"Swim shorts \u2014 worn under","ref":"swim-is","g":100,"crit":true,"note":"Wear them rather than pack them. You'll stop at The Basin, Little Salmon and Parakeet, and changing facilities are thin away from the settlement."},{"name":"Quick-dry towel","ref":"quick-towel","g":180,"crit":true},{"name":"Dry bag, 10L","ref":"drybag","g":150,"crit":true,"note":"Phone, wallet and keys while you swim. Bags are not watched at the bays."},{"name":"Rash vest or light long sleeve","ref":"rashvest","g":200,"note":"Your back and shoulders are pointed at the sun for six hours on a bike. This is the difference between a good evening and a ruined one."},{"name":"Power bank","ref":"powerbank","g":300,"note":"Maps, photos and the return ferry QR all live on your phone."},{"name":"Card and some cash","ref":"cards","g":20,"note":"Hotel Rottnest and the Thomson Bay bakery take cards. Take a bit of the AUD 200 float anyway \u2014 this is exactly the sort of day it exists for."},{"name":"Snacks","ref":null,"g":200,"note":"Food away from Thomson Bay is essentially nothing. Even with lunch booked, carry something for the middle of the island."},{"name":"Plasters","ref":"plasters","g":30,"note":"Saddle soreness and a blister from wet feet in dry shoes are the two likely ones."},{"name":"Dry shirt for the ferry home","ref":null,"g":150,"note":"You'll be salty, sunburnt and damp at 16:00. The air con on the boat is cold."},{"name":"Ferry booking 2G6JZV","ref":null,"g":0,"crit":true,"note":"Saved offline. Show the barcode to the crew at the vessel."}]},{"id":"cricket","name":"BBL at Optus Stadium","date":"2026-12-26","dates":"Sat 26 Dec","bag":"Sling bag only","where":"Perth Scorchers v Melbourne Stars","note":"18:15 to 22:15, Boxing Day. Four tickets at A$74 each, bought through Ticketmaster \u2014 they live in the Ticketmaster app, so have it installed and logged in before you go.","warn":"Bag rules are enforced: nothing larger than 40 x 30 cm, and some events ban backpacks entirely. Take the sling, not the daypack. A sealed or empty water bottle is fine, glass and cans are not.","items":[{"name":"Tickets in the Ticketmaster app","ref":null,"g":0,"crit":true,"note":"Downloaded before you leave \u2014 stadium wifi at a full house is not something to rely on."},{"name":"Phone","ref":"phone","g":220,"crit":true},{"name":"Mini charger brick","ref":"brick-sm","g":200,"note":"18:15 to 22:15 with the tickets on your phone."},{"name":"Decanted suncream","ref":"suncream-tr","g":80,"crit":true,"note":"A 18:15 start in December still has hours of sun on you."},{"name":"Sunglasses","ref":"sunglasses","g":40},{"name":"Card","ref":"cards","g":20,"note":"The stadium is cashless."}]}],"shopping":[{"id":"perth","name":"Perth, first few days","when":"From 20 Nov","where":"Coles or Woolworths \u00b7 Chemist Warehouse \u00b7 any sports shop","note":"You have seven weeks here and a kitchen at the Sebel, so this is a proper shop, not a top-up. Chemist Warehouse is substantially cheaper than a supermarket for suncream, toiletries and supplements \u2014 it's the one worth a dedicated trip.","items":[{"name":"Suncream SPF50+, large \u2014 check it is reef-safe","crit":true,"note":"Australian suncream is the best in the world and cheap here. Buy the big bottle and a small one for the bag \u2014 this is also what you decant for Thailand. Check the ingredients now: Thai marine national parks ban oxybenzone, octinoxate, 4-methylbenzylidene camphor and butylparaben, with fines up to 100,000 baht. Khao Sok and the Krabi marine parks both count."},{"name":"Protein powder","crit":true,"note":"Chemist Warehouse or a sports shop beats the supermarket on price. Buy a tub sized for seven weeks \u2014 you won't be taking it to Thailand, so don't over-buy."},{"name":"Toothpaste","note":"You're carrying the brush but not the paste."},{"name":"Shampoo, conditioner, body wash","note":"Only if the toiletries waiting for you don't already cover it."},{"name":"Aftersun or aloe","note":"Perth in December catches everyone once. Cheaper here than regretting it."},{"name":"Laundry pods or sheets","note":"The Sebel is self-service, so you need your own for the first stretch. Thailand is paid-for and you won't need these there."},{"name":"Reusable shopping bag","note":"Supermarkets charge for bags and you're here seven weeks."},{"name":"Milk","note":"First shop. The Sebel has a kitchen."},{"name":"Eggs","note":""},{"name":"Breakfast and kitchen basics","note":"Coffee, cereal, bread \u2014 whatever stops you buying breakfast out every day for four weeks."},{"name":"Insect repellent, if yours is mild","note":"Perth doesn't need much. Buy the serious DEET in Thailand instead, where it's stronger and cheaper."}]},{"id":"thailand","name":"Thailand top-up","when":"From 7 Jan","where":"7-Eleven, Boots or any pharmacy","note":"Deliberately short. Everything here is cheap, everywhere, and carrying it from Australia is pointless \u2014 especially with the cases going into storage on the 10th.","items":[{"name":"DEET insect repellent","crit":true,"note":"Stronger and cheaper than anything you'd bring. Khao Sok is jungle on water and the lake is worst at dusk."},{"name":"Suncream top-up","note":"You'll have burned through the decanted 100 ml by Samui."},{"name":"Elephant pants","crit":true,"note":"Your temple trousers. Buy them in Bangkok on the 11th, before the Grand Palace and Wat Phra Kaew \u2014 the dress code is enforced at the gate, not politely overlooked."},{"name":"Small dry bag, if you haven't bought one at home","note":"Beach shops in Samui and Krabi sell them everywhere. Needed before Khao Sok on the 17th."},{"name":"Cheap flip-flops","note":"The pair you leave behind. Beach, boat and bathroom."}]}]};
